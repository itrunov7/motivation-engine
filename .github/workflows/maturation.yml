# Maturation workflow — the weekly maturation loop (D-052).
#
# The spiral turns on a schedule, on a budget, forever:
#   (1) npm run analyze          → analysis/sufficiency-matrix.json (full grid)
#   (2) npm run gaps             → routes gaps by fix_type (D-055/D-056/D-083):
#         analysis/research-queue.json    — HARVEST gaps only (ranked, budget-bounded, D-051)
#         analysis/extraction-queue.json  — PIPELINE gaps (Actions-only, quote-gated)
#         analysis/authoring-queue.json   — STRUCTURAL gaps for the owner (never harvested)
#       A cell whose scored gaps are all structural is never harvested — no
#       evidence fetch flips it, so it consumes no budget and dispatches no
#       connector; it waits in the authoring queue for an owner edit in git.
#   (3) ops-gate plan-queue      → gate the top-N tasks through the EXISTING
#       guards (paused, health-down, per-run limits, monthly budget — D-024/
#       D-025/D-030, never re-implemented here) with the batch's own pending
#       spend projected cumulatively, then harvest each "run" task via the
#       evidence connector with the task's segment-qualified terms
#   (4) npm run analyze -- packs=<affected>   → re-score ONLY the harvested
#       packs' cells, preserving the rest of the matrix
#   (5) npm run packs -- packs=<flipped>      → regenerate ONLY the packs whose
#       cells flipped to green
#   (6) commit as `maturation: week {date} — filled {gaps} gaps` with a job
#       summary showing the red→green cell diff, regenerated packs, and spend.
#
# NEVER exhausts the budget: the gap planner already bounds the queue by the
# monthly cap (D-051), and plan-queue re-gates every task at harvest time with
# cumulative batch accounting — a task that no longer fits is DEFERRED to next
# week (action "defer", reason logged in the job summary), never forced.
# raise_cap is never passed here.
#
# Operator contract (D-022): watch issues, not logs. A failing harvest is
# retried once after a backoff; a persistent failure opens a deduplicated ops
# issue and fails the run red.
#
# A red job still leaves the surface CURRENT (D-097). Steps (1) and (2) already
# computed a fresh matrix and queues before any evidence was fetched, so a
# harvest failure must never discard them: re-analysis, the summary, the log
# entry, the commit, and the checkpoint continuations run regardless of harvest
# outcome, while the steps that genuinely need harvested evidence (defer,
# low-novelty count, harvest ledger, extraction) stay gated on it. The commit
# message and the log entry are marked partial so a degraded week is never
# presented as a clean one, and the job still goes red.
#
# S2 rate compliance (D-027): this workflow MUST reuse the exact concurrency
# group "connectors-s2" from connectors.yml/harvest.yml so two runner
# processes never call Semantic Scholar at the same time.

name: maturation

run-name: >-
  maturation — ${{ github.event_name == 'workflow_dispatch' && format('dispatch (top {0})', inputs.max_tasks || 'all') || 'weekly' }}

on:
  schedule:
    # Monday 07:00 UTC — behind the scheduled evidence run (Mon 05:00,
    # connectors.yml); the shared concurrency group serializes them anyway.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      max_tasks:
        description: "Harvest at most N queued tasks (blank = the full budget-bounded queue)"
        required: false
        type: string
        default: ""

concurrency:
  group: connectors-s2
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  maturation:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      MAX_TASKS: ${{ inputs.max_tasks || '' }}
      S2_API_KEY: ${{ secrets.S2_API_KEY }}
      CONNECTOR_MAILTO: ${{ vars.CONNECTOR_MAILTO }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ---------- (1) analyze + (2) plan gaps ----------
      # The pre-harvest matrix is kept aside as the baseline for the
      # red→green diff after re-analysis.
      - name: Analyze sufficiency and plan gaps
        run: |
          set -euo pipefail
          npm run analyze
          cp analysis/sufficiency-matrix.json matrix-before.json
          npm run gaps

      # ---------- (3) gate the queue through the existing guards ----------
      # plan-queue reuses paused / health-down / per-run limits / monthly
      # budget and defers over-budget tasks to next week; every run/defer/skip
      # reason lands in the job summary.
      - name: Gate the research queue (writes the plan to the summary)
        run: |
          set -euo pipefail
          npx tsx tools/ops-gate.ts plan-queue "$MAX_TASKS" > queue-plan.json 2> plan-summary.md
          cat plan-summary.md >> "$GITHUB_STEP_SUMMARY"
          npx tsx tools/ops-gate.ts budget > budget-before.json
          # An empty extraction plan exists from here on, so the re-analysis,
          # summary, and log steps read a real file even when the extraction
          # step is skipped by a failed harvest (D-097).
          jq -n '{ entries: [] }' > extraction-plan.json

      # Harvest each due task with its segment-qualified terms. Retry once
      # after a 60s backoff per target (D-022); a persistent failure is
      # recorded as an output so the issue step runs before the job goes red.
      - name: Harvest due tasks (retry once per target)
        id: harvest
        run: |
          set +e
          jq -r '.entries[] | select(.action == "run") | [.mechanism, .terms] | @tsv' queue-plan.json > due.tsv
          if [ ! -s due.tsv ]; then
            echo "Nothing due — the plan deferred or skipped every task (see summary)."
            echo "ran=false" >> "$GITHUB_OUTPUT"
            echo "failed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          harvest_one() {
            local mechanism="$1" terms="$2"
            npm run connector -- evidence "mechanism=$mechanism" "terms=$terms" 2>&1 | tee -a harvest.log
            return ${PIPESTATUS[0]}
          }
          overall=0
          while IFS=$'\t' read -r mechanism terms; do
            echo "::group::harvest evidence ${mechanism}"
            harvest_one "$mechanism" "$terms"
            code=$?
            if [ "$code" -ne 0 ]; then
              echo "::warning::harvest evidence ${mechanism} failed (exit $code) — backing off 60s then retrying once."
              sleep 60
              harvest_one "$mechanism" "$terms"
              code=$?
            fi
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then overall=1; fi
          done < due.tsv
          echo "ran=true" >> "$GITHUB_OUTPUT"
          if [ "$overall" -ne 0 ]; then echo "failed=true" >> "$GITHUB_OUTPUT"; else echo "failed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Defer checkpointed saturation tasks
        if: steps.harvest.outputs.ran == 'true' && steps.harvest.outputs.failed != 'true'
        run: |
          set -euo pipefail
          # Checkpoints are named <mechanism>.<fingerprint-prefix>.json (D-096),
          # so the mechanism id is the segment before the first dot.
          for checkpoint in corpora/_ops/checkpoints/evidence/*.json; do
            [ -f "$checkpoint" ] || continue
            mechanism="${checkpoint##*/}"
            mechanism="${mechanism%%.*}"
            jq --arg mechanism "$mechanism" '
              .entries |= map(
                if .mechanism == $mechanism and .action == "run"
                then .action = "defer"
                  | .reason = "saturation time slice checkpointed; continuation queued"
                else .
                end
              )
            ' queue-plan.json > queue-plan.next.json
            mv queue-plan.next.json queue-plan.json
          done
          jq -r '.entries[] | select(.action == "run") | [.mechanism, .terms] | @tsv' \
            queue-plan.json > due.tsv

      # ---------- Count low-novelty harvests (D-058) ----------
      # A harvest that returned mostly records already in the corpus is a
      # re-fetch of the same canon, NOT progress. The connector flags it in the
      # corpus file's diversity_report; here we count how many of THIS run's
      # harvested mechanisms came back low-novelty, for the summary + log.
      - name: Count low-novelty harvests
        id: novelty
        if: steps.harvest.outputs.ran == 'true' && steps.harvest.outputs.failed != 'true'
        run: |
          set -euo pipefail
          count=0
          while IFS=$'\t' read -r mechanism terms; do
            f="corpora/evidence/${mechanism}.json"
            [ -f "$f" ] || continue
            low=$(jq -r '.diversity_report.novelty.low_novelty // false' "$f" 2>/dev/null || echo false)
            if [ "$low" = "true" ]; then count=$((count + 1)); fi
          done < due.tsv
          echo "low_novelty=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            {
              echo ""
              echo "$count harvest(s) returned mostly already-known records (low novelty, D-058) — not counted as progress."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ---------- Record the per-target harvest ledger (D-059) ----------
      # BEFORE re-analysis: append this week's harvested (mechanism × segment)
      # targets and their low-novelty flags to analysis/harvest-history.json, so
      # a cell that crosses the K-week low-novelty bar THIS week is marked
      # evidence_exhausted by the very next re-analyze — the loop stops harvesting
      # thin literature in the same run rather than a week later. Records only
      # tasks the plan RAN; a deferred/skipped task adds no attempt.
      - name: Record the harvest history ledger
        if: steps.harvest.outputs.failed != 'true'
        run: |
          set -euo pipefail
          npx tsx tools/harvest-history.ts \
            --queue-plan queue-plan.json \
            --week "$(date -u +%Y-%m-%d)"

      # ---------- Run Actions-only extraction tasks (D-083) ----------
      # Each task is quoted immediately before it runs. The quote reads the
      # manifest left by prior tasks, so token/USD/call accounting is cumulative
      # across the batch. A blocked quote is deferred, never forced; exhausted
      # monthly extraction caps are recorded explicitly as a scheduled pause.
      - name: Run budget-approved extraction tasks
        id: extraction
        if: steps.harvest.outputs.failed != 'true'
        run: |
          set -euo pipefail
          jq -c '.tasks[]' analysis/extraction-queue.json | while IFS= read -r task; do
            mode=$(jq -r '.mode' <<<"$task")
            mechanism=$(jq -r '.mechanism' <<<"$task")
            if npm run extract -- quote "mode=$mode" "mechanism=$mechanism" > extraction-quote.log 2>&1; then
              npm run extract -- run "mode=$mode" "mechanism=$mechanism"
              action=run
              reason="quote allowed; extraction completed"
            else
              action=defer
              quote_reasons=$(jq -r '.reasons | join("; ")' quote.json 2>/dev/null || true)
              if jq -e '.reasons | any(test("monthly (USD|token) cap"))' quote.json >/dev/null 2>&1; then
                reason="paused — monthly extraction cap exhausted: ${quote_reasons}"
                echo "::warning::${reason}"
              elif [ -n "$quote_reasons" ]; then
                reason="quote blocked: ${quote_reasons}"
              else
                reason=$(< extraction-quote.log)
                reason="${reason: -1000}"
              fi
            fi
            jq \
              --arg action "$action" \
              --arg reason "$reason" \
              --argjson task "$task" \
              '.entries += [$task + { action: $action, reason: $reason }]' \
              extraction-plan.json > extraction-plan.next.json
            mv extraction-plan.next.json extraction-plan.json
          done
          echo "dispatched=$(jq '[.entries[] | select(.action == "run")] | length' extraction-plan.json)" >> "$GITHUB_OUTPUT"
          echo "deferred=$(jq '[.entries[] | select(.action == "defer")] | length' extraction-plan.json)" >> "$GITHUB_OUTPUT"

      # ---------- (4) re-analyze ONLY the affected cells ----------
      # Affected = the packs whose gap cells the harvested/extraction tasks addressed;
      # every other pack's cells are preserved from the baseline matrix.
      # Runs even when the harvest failed (D-097). A failed evidence fetch may
      # not discard the matrix and queues step 1 already computed, and any
      # corpus a SUCCEEDING target did write is real evidence that must be
      # scored and committed. The harvest step itself always exits 0 and
      # reports through its outputs, so the absence of an `if:` here means
      # "run unless something genuinely broke earlier in the job".
      - name: Re-analyze affected cells
        id: reanalyze
        run: |
          set -euo pipefail
          affected=$(jq -nr \
            --slurpfile harvest queue-plan.json \
            --slurpfile extraction extraction-plan.json \
            '[ ($harvest[0].entries[] | select(.action == "run") | .pack),
               ($extraction[0].entries[] | select(.action == "run") | .source_cells[].pack) ]
             | unique | join(",")')
          if [ -n "$affected" ]; then
            if printf '%s' "$affected" | tr ',' '\n' | grep -qx perception; then
              npm run analyze
            else
              npm run analyze -- "packs=$affected"
            fi
            npm run gaps
          else
            echo "No automated filler ran — matrix and queues remain at the step-1 baseline."
          fi
          jq -n \
            --slurpfile before matrix-before.json \
            --slurpfile after analysis/sufficiency-matrix.json \
            '[ $after[0].cells[] as $cell
               | ($before[0].cells[] | select(.pack == $cell.pack and .segment == $cell.segment)) as $old
               | select($old.status != $cell.status)
               | { pack: $cell.pack, segment: $cell.segment, from: $old.status, to: $cell.status } ]' \
            > cell-diff.json
          echo "filled=$(jq '[.[] | select(.to == "green")] | length' cell-diff.json)" >> "$GITHUB_OUTPUT"
          echo "flipped_packs=$(jq -r '[.[] | select(.to == "green") | .pack] | unique | join(",")' cell-diff.json)" >> "$GITHUB_OUTPUT"
          # Evidence-exhausted cells in the re-scored matrix (D-059) — thin
          # literature the loop stopped harvesting; recorded in the weekly log.
          echo "exhausted=$(jq '[.cells[] | select(.evidence_exhausted == true)] | length' analysis/sufficiency-matrix.json)" >> "$GITHUB_OUTPUT"

      # ---------- (5) regenerate ONLY the packs whose cells went green ----------
      # Gated on the flip, not on the harvest: if a cell really went green the
      # pack export must match the matrix we are about to commit, otherwise the
      # committed week would claim green from a stale pack (invariants 2/3).
      - name: Regenerate packs for filled cells
        if: steps.reanalyze.outputs.flipped_packs != ''
        run: |
          set -euo pipefail
          flipped="${{ steps.reanalyze.outputs.flipped_packs }}"
          # A perception flip (D-067) is not a renderable pack: the cross-cutting
          # row's evidence lands in the cross_cutting_perception section of EVERY
          # pack, so a full re-render is required. A pack flip re-renders only
          # that pack. Detect perception in the flipped set and branch.
          if printf '%s' "$flipped" | tr ',' '\n' | grep -qx perception; then
            npm run packs
          else
            npm run packs -- "packs=$flipped"
          fi

      # ---------- Job summary: red→green diff, packs regenerated, spend ----------
      - name: Maturation summary
        run: |
          set -euo pipefail
          npx tsx tools/ops-gate.ts budget > budget-after.json
          {
            echo ""
            echo "### Maturation week $(date -u +%Y-%m-%d)"
            echo ""
            if [ "${{ steps.harvest.outputs.failed }}" = "true" ]; then
              echo "PARTIAL WEEK — the harvest step failed after its retry, so extraction was skipped."
              echo "The matrix, queues, and any corpus a succeeding target wrote are still scored and committed."
              echo ""
            fi
            if [ "$(jq 'length' cell-diff.json)" -gt 0 ]; then
              echo "Cell status changes:"
              jq -r '.[] | "- \(.pack) × \(.segment): \(.from) → \(.to)"' cell-diff.json
            else
              echo "No cell changed status this week."
            fi
            echo ""
            flipped="${{ steps.reanalyze.outputs.flipped_packs }}"
            if [ -n "$flipped" ]; then
              echo "Packs regenerated: $flipped"
            else
              echo "Packs regenerated: none (no cell flipped to green)"
            fi
            echo ""
            jq -rn \
              --slurpfile before budget-before.json \
              --slurpfile after budget-after.json \
              '"Spend this run: \($after[0].used.calls - $before[0].used.calls) calls, $\($after[0].used.usd - $before[0].used.usd) — month \($after[0].month): \($after[0].used.calls)/\($after[0].caps.calls) calls used."'
            echo ""
            harvest_dispatched=$(jq '[.entries[] | select(.action == "run")] | length' queue-plan.json)
            structural_queued=$(jq '.tasks | length' analysis/authoring-queue.json 2>/dev/null || echo 0)
            extraction_dispatched=$(jq '[.entries[] | select(.action == "run")] | length' extraction-plan.json)
            extraction_deferred=$(jq '[.entries[] | select(.action == "defer")] | length' extraction-plan.json)
            echo "Routing (D-083): $harvest_dispatched harvest task(s) dispatched, $extraction_dispatched extraction task(s) dispatched, $extraction_deferred extraction task(s) deferred, $structural_queued structural task(s) queued for authoring."
            deferred=$(jq '[.entries[] | select(.action == "defer")] | length' queue-plan.json)
            if [ "$deferred" -gt 0 ]; then
              echo ""
              echo "$deferred task(s) deferred to next week (budget) — reasons in the plan above."
            fi
            exhausted="${{ steps.reanalyze.outputs.exhausted || '0' }}"
            if [ "$exhausted" -gt 0 ]; then
              echo ""
              echo "$exhausted cell(s) marked evidence-exhausted (thin literature, D-059) — dropped from the harvest queue and routed to authoring for alternative fillers. The loop never harvests indefinitely against thin literature."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------- Persist the week's turn for the /maturation cockpit ----------
      # Records the same diff / spend / deferred figures the job summary shows
      # into analysis/maturation-log.json (D-053) so the cockpit reads the
      # weekly history from a file instead of the ephemeral Actions summary.
      # It only records what steps 1-5 already computed; a zero-flip week is
      # recorded truthfully.
      - name: Record the maturation log entry
        run: |
          set -euo pipefail
          npx tsx tools/maturation-log.ts \
            --cell-diff cell-diff.json \
            --budget-before budget-before.json \
            --budget-after budget-after.json \
            --queue-plan queue-plan.json \
            --authoring-queue analysis/authoring-queue.json \
            --extraction-plan extraction-plan.json \
            --low-novelty "${{ steps.novelty.outputs.low_novelty || '0' }}" \
            --evidence-exhausted "${{ steps.reanalyze.outputs.exhausted || '0' }}" \
            --harvest-failed "${{ steps.harvest.outputs.failed || 'false' }}" \
            --week "$(date -u +%Y-%m-%d)"

      # ---------- (6) commit the week's turn ----------
      # Commits whatever the week actually produced, harvest failure included
      # (D-097). A red job must still leave the surface current; the message
      # says "partial" so a degraded week is never presented as a clean one.
      - name: Commit maturation results if changed
        run: |
          if [ -n "$(git status --porcelain analysis corpora packs proposals)" ]; then
            if [ "${{ steps.harvest.outputs.failed }}" = "true" ]; then
              suffix=" (partial — harvest failed)"
            else
              suffix=""
            fi
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add analysis corpora packs proposals
            git commit -m "maturation: week $(date -u +%Y-%m-%d) — filled ${{ steps.reanalyze.outputs.filled || '0' }} gaps${suffix}"
            git push
          else
            echo "Nothing changed — no commit."
          fi

      - name: Queue checkpoint continuations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # One mechanism can hold several checkpoints, one per segment-qualified
          # term set (D-096), so each FILE is its own continuation and the
          # dispatch id must carry the fingerprint to stay unique.
          for checkpoint in corpora/_ops/checkpoints/evidence/*.json; do
            [ -f "$checkpoint" ] || continue
            slice="${checkpoint##*/}"
            slice="${slice%.json}"
            target="${slice%%.*}"
            print="${slice#*.}"
            terms=$(jq -r '.terms | join(";")' "$checkpoint")
            gh workflow run harvest.yml \
              --ref "${GITHUB_REF_NAME}" \
              -f connector=evidence \
              -f target="$target" \
              -f terms="$terms" \
              -f dry_run=false \
              -f dispatch_id="maturation-${GITHUB_RUN_ID}-${target}-${print}" \
              -f raise_cap=false
            echo "Queued continuation for $target (slice $print)."
          done

      - name: Open ops issue on persistent failure
        if: steps.harvest.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="maturation loop failing"
          gh label create ops --color B60205 --description "operations: a connector is failing (D-022)" 2>/dev/null || true
          existing=$(gh issue list --state open --label ops --search "in:title ${title}" --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n1)
          if [ -n "${existing}" ]; then
            echo "Issue #${existing} already open for \"${title}\" — not duplicating."
            exit 0
          fi
          {
            echo "The weekly maturation loop's harvest step failed twice in a row (initial attempt + one retry after backoff) in [\`${GITHUB_WORKFLOW}\` run #${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo ""
            echo '```'
            tail -n 40 harvest.log 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo ""
            echo "Operator contract (D-022): watch issues, not logs. Close this issue after the fix to re-arm the automation."
          } > issue-body.md
          gh issue create --title "${title}" --label ops --body-file issue-body.md

      - name: Fail the job on persistent failure
        if: steps.harvest.outputs.failed == 'true'
        run: |
          echo "::error::maturation harvest failed after retry — an ops issue was opened/confirmed."
          exit 1
