name: validate

on: [push]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `next build` never trips on missing env; real
      # secrets live only in the Vercel deployment environment.
      ACCESS_PASSWORD: ci-dummy-password
      SESSION_SECRET: ci-dummy-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
