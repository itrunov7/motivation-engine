name: validate

on: [push]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Dummy values so `next build` never trips on missing env; real
      # secrets live only in the Vercel deployment environment.
      ACCESS_PASSWORD: ci-dummy-password
      SESSION_SECRET: ci-dummy-secret
      # Optional Semantic Scholar key for connector runs (D-018); empty
      # when the repository secret is unset — connectors degrade gracefully.
      S2_API_KEY: ${{ secrets.S2_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run test:proposals
      - run: npm run test:ops
      - run: npm run test:github
      - run: npm run test:spans
      - run: npm run test:span-role
      - run: npm run test:provenance
      - run: npm run test:extract
      - run: npm run test:evidence
      - run: npm run test:analyzer
      - run: npm run test:gaps
      - run: npm run test:packs
      # D-134: a test may not write to a committed path. Enforced rather than
      # promised — analyzer.test.ts rewrote analysis/sufficiency-matrix.json on
      # every run, which made `git status` useless as a signal and let a
      # regenerated artifact ride along in an unrelated commit.
      - name: tests left the working tree unchanged (D-134)
        run: git diff --exit-code
      - run: npm run build
