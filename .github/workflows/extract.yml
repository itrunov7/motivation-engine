# Grounded corpus extraction — dispatch only (D-075/D-078).
# Dry runs make no LLM calls and upload quote.json. Real runs are budget-gated,
# write only proposals plus the extraction cost manifest, validate, and commit.
name: extract

run-name: >-
  extract ${{ inputs.mode }} — ${{ inputs.scope_kind }}=${{ inputs.scope_id }}${{ inputs.dry_run == 'true' && ' (dry-run)' || '' }}${{ inputs.dispatch_id != '' && format(' [{0}]', inputs.dispatch_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "One task type: effects, realizations, interactions, dissent, mechanism, dossier"
        required: true
        type: choice
        options:
          - effects
          - realizations
          - interactions
          - dissent
          - mechanism
          - dossier
      scope_kind:
        description: "Scope resolver"
        required: true
        type: choice
        options:
          - mechanism
          - pack
          - segment
      scope_id:
        description: "Mechanism, pack, or segment id"
        required: true
        type: string
      dry_run:
        description: "Estimate tokens and USD without calling OpenRouter"
        required: true
        type: boolean
        default: true
      dispatch_id:
        description: "Correlation id echoed into run-name so /ops can poll this run (D-025)"
        required: false
        type: string
        default: ""

concurrency:
  group: extraction
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  quote:
    if: inputs.dry_run == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A blocked verdict (e.g. over the per-run cap) is a SUCCESSFUL estimate,
      # not a job failure: this step exits 0 so quote.json uploads and /ops can
      # show the operator the reason. Only the real run's pre-flight gate below
      # runs with enforce=true and fails closed on a blocked verdict (D-088).
      - name: Compute deterministic extraction quote
        run: >-
          npm run extract --
          quote
          mode=${{ inputs.mode }}
          ${{ inputs.scope_kind }}=${{ inputs.scope_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extraction-quote
          path: quote.json
          retention-days: 1

  run:
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Correlation id echoed into the live progress heartbeat (D-086).
      OPS_DISPATCH_ID: ${{ inputs.dispatch_id || github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # This estimate is deliberately a separate step before any process with
      # OPENROUTER_API_KEY can call a model (D-087).
      - name: Estimate cost and enforce budget gates before extraction
        run: >-
          npm run extract --
          quote
          mode=${{ inputs.mode }}
          ${{ inputs.scope_kind }}=${{ inputs.scope_id }}
          enforce=true
      # Wrap the run in the progress publisher (D-086): the live heartbeat is
      # force-pushed to the ops-progress ref every ~2 min so /ops shows batches
      # drafted and running token spend while extraction is in flight.
      - name: Extract grounded proposals
        run: >-
          npx tsx tools/progress-publisher.ts
          npm run extract --
          run
          mode=${{ inputs.mode }}
          ${{ inputs.scope_kind }}=${{ inputs.scope_id }}
      - name: Validate generated proposals and manifest
        run: npm run validate
      - name: Commit proposals and extraction accounting
        run: |
          if [ -n "$(git status --porcelain proposals corpora/extraction)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add proposals corpora/extraction
            git commit -m "data: extract ${{ inputs.mode }} for ${{ inputs.scope_kind }} ${{ inputs.scope_id }}"
            git push
          else
            echo "No novel grounded proposals — nothing to commit."
          fi
