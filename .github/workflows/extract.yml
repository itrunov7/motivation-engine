# Grounded corpus extraction — dispatch only (D-075/D-078).
# Dry runs make no LLM calls and upload quote.json. Real runs are budget-gated,
# write only proposals plus the extraction cost manifest, validate, and commit.
name: extract

run-name: >-
  extract ${{ inputs.mode }} — ${{ inputs.scope_kind }}=${{ inputs.scope_id }}${{ inputs.dry_run == 'true' && ' (dry-run)' || '' }}${{ inputs.dispatch_id != '' && format(' [{0}]', inputs.dispatch_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "One task type: effects, realizations, interactions, dissent, mechanism, dossier"
        required: true
        type: choice
        options:
          - effects
          - realizations
          - interactions
          - dissent
          - mechanism
          - dossier
      scope_kind:
        description: "Scope resolver (effect applies to mode=realizations only, D-112)"
        required: true
        type: choice
        options:
          - mechanism
          - pack
          - segment
          - effect
      scope_id:
        description: "Mechanism, pack, segment, or effect id"
        required: true
        type: string
      dry_run:
        description: "Estimate tokens and USD without calling OpenRouter"
        required: true
        type: boolean
        default: true
      preflight:
        description: "Route-check both tiers with max_tokens=1 before the run (~$0.0001, D-107)"
        required: false
        type: boolean
        default: false
      dispatch_id:
        description: "Correlation id echoed into run-name so /ops can poll this run (D-025)"
        required: false
        type: string
        default: ""

concurrency:
  group: extraction
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  quote:
    if: inputs.dry_run == true && inputs.preflight != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A blocked verdict (e.g. over the per-run cap) is a SUCCESSFUL estimate,
      # not a job failure: this step exits 0 so quote.json uploads and /ops can
      # show the operator the reason. Only the real run's pre-flight gate below
      # runs with enforce=true and fails closed on a blocked verdict (D-088).
      - name: Compute deterministic extraction quote
        run: >-
          npm run extract --
          quote
          mode=${{ inputs.mode }}
          ${{ inputs.scope_kind }}=${{ inputs.scope_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extraction-quote
          path: quote.json
          retention-days: 1

  # Route-check only (D-107). A run that 404s on its first call produces no
  # completion and no usage block, so it is diagnosable only from the routing
  # error itself — cheaper to establish here, for ~$0.0001, than by dispatching
  # a run and reading the wreckage. Runs standalone: pick dry_run=false and
  # preflight=true to check routing without extracting anything.
  preflight:
    if: inputs.preflight == true
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Route-check both tiers with the production parameter set
        run: npm run openrouter-preflight

  run:
    if: inputs.dry_run != true && inputs.preflight != true
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Correlation id echoed into the live progress heartbeat (D-086).
      OPS_DISPATCH_ID: ${{ inputs.dispatch_id || github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Heal any previous run that lost its accounting commit (D-342) BEFORE the
      # budget gate reads the manifest, so the cap is computed against every
      # measured dollar rather than only the ones whose commit happened to land.
      # A receipt is conflict-free but cap-invisible until it is folded back;
      # this is the fold.
      - name: Reconcile orphaned spend receipts
        run: npx tsx tools/reconcile-spend.ts --apply
      # This estimate is deliberately a separate step before any process with
      # OPENROUTER_API_KEY can call a model (D-087).
      - name: Estimate cost and enforce budget gates before extraction
        run: >-
          npm run extract --
          quote
          mode=${{ inputs.mode }}
          ${{ inputs.scope_kind }}=${{ inputs.scope_id }}
          enforce=true
      # Wrap the run in the progress publisher (D-086): the live heartbeat is
      # force-pushed to the ops-progress ref every ~2 min so /ops shows batches
      # drafted and running token spend while extraction is in flight.
      - name: Extract grounded proposals
        id: extract
        run: >-
          npx tsx tools/progress-publisher.ts
          npm run extract --
          run
          mode=${{ inputs.mode }}
          ${{ inputs.scope_kind }}=${{ inputs.scope_id }}
      # ---------- Accounting lands FIRST, unconditionally (D-099/D-168) -------
      # This step used to sit AFTER `npm run validate`, and so did its own
      # fallback — which then re-ran the same failing validate. A broken ledger
      # therefore blocked both commit paths, and run 31095467232's spend was
      # lost: real money the monthly cap (derived from committed manifests) can
      # never see. The two questions are now separated in the order that
      # matters: "is the money recorded" is answered before "was the run sound".
      #
      # Scoped to corpora/extraction ONLY, and it runs on `always()` so a failed
      # extraction still records what it burned. `proposals` is deliberately not
      # here — it stays fail-closed behind validation below (rule 8).
      #
      # D-342 then found the third position the blocker could hide in. D-168
      # moved it off `npm run validate`; D-173 fixed the discard predicate but
      # never touched the git tail — so the tail itself became the thing that
      # could swallow a run's accounting. The commit is now split: the
      # conflict-free receipt lands first and alone, the conflict-prone
      # aggregates follow best-effort, and both retry.
      - name: Record extraction spend before anything can block it
        if: always()
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain corpora/extraction)" ]; then
            echo "No extraction accounting to record — the run spent nothing."
            exit 0
          fi
          # A FAILED run's partial proposals must never reach the queue, and must
          # not ride along in this commit either (rule 8). Gated on the extract
          # step's own outcome, because this step runs on always(): discarding
          # unconditionally destroyed the proposals of a SUCCESSFUL run before
          # the commit step below could see them. Run 31107545446 wrote 5
          # held_low_confidence proposals and committed none of them for exactly
          # that reason (D-173).
          if [ "${{ steps.extract.outcome }}" != "success" ]; then
            echo "Extraction did not succeed — discarding its partial proposals."
            git checkout -- proposals 2>/dev/null || true
            git clean -fd proposals
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # A rebase resolves a fast-forward race. It CANNOT resolve a content
          # conflict, and coverage.json/ledger.json/manifest.json are whole-file
          # rewrites that concurrent runs are guaranteed to conflict on. On
          # 2026-08-11 three realizations runs raced, this step's rebase
          # conflicted on all three files, `set -e` killed the step, and
          # $0.070004 of measured spend reached no committed artifact (D-342).
          # The comment that used to sit here claimed the rebase was the
          # protection against exactly that race. It was not.
          push_with_retry() {
            local label="$1" attempt=1
            while [ "$attempt" -le 3 ]; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
                && git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "${label}: pushed on attempt ${attempt}"
                return 0
              fi
              # Leave no rebase in progress for the next attempt or the next step.
              git rebase --abort 2>/dev/null || true
              echo "${label}: attempt ${attempt} did not land"
              attempt=$((attempt + 1))
              [ "$attempt" -le 3 ] && sleep $((attempt * 5))
            done
            return 1
          }

          # (1) THE RECEIPT FIRST. corpora/extraction/spend/<run-id>.json and
          # rejected/<run-id>.json are one file per run, named for the run's own
          # start timestamp, so no concurrent run can ever touch the same path
          # and this commit always rebases cleanly. This is the durable record;
          # everything below is a convenience.
          if [ -n "$(git status --porcelain corpora/extraction/spend corpora/extraction/rejected)" ]; then
            git add corpora/extraction/spend corpora/extraction/rejected
            git commit -m "data: spend receipt for ${{ inputs.mode }} on ${{ inputs.scope_kind }} ${{ inputs.scope_id }}"
            if ! push_with_retry "receipt"; then
              echo "::error::the per-run spend receipt could not be pushed. The measured \
              spend is in this log above (SPEND, MEASURED) and the run is UNRECONCILED: \
              run tools/reconcile-spend.ts once the branch is writable."
            fi
          fi

          # (2) THE AGGREGATES, BEST EFFORT. These are the files that conflict.
          # A failure here is now survivable: the receipt is already committed,
          # and the next run's reconcile step folds it into run_history so the
          # monthly cap sees it.
          if [ -n "$(git status --porcelain corpora/extraction)" ]; then
            git add corpora/extraction
            git commit -m "data: record extraction spend for ${{ inputs.mode }} on ${{ inputs.scope_kind }} ${{ inputs.scope_id }}"
            if ! push_with_retry "aggregates"; then
              echo "::warning::aggregate accounting (coverage/ledger/manifest) lost a \
              write race and was not pushed. The spend receipt IS committed, so no money \
              is invisible; the next run reconciles it (D-342)."
              # Deliberately NOT `git reset --hard`: if the receipt push above also
              # failed, its commit is still local-only and a reset would destroy
              # the one artifact this whole step exists to protect.
            fi
          fi

      - name: Validate generated proposals and manifest
        run: npm run validate

      # Proposals commit only once validation has passed. A ledger recorded as
      # `broken` no longer fails validate (D-168) — it is reported — so a broken
      # run can still land its proposals if they are otherwise valid, while the
      # job below still goes red so the breakage is impossible to miss.
      - name: Commit reviewed proposals
        if: success()
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain proposals corpora/extraction)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add proposals corpora/extraction
            git commit -m "data: extract ${{ inputs.mode }} for ${{ inputs.scope_kind }} ${{ inputs.scope_id }}"
            # Same rebase-conflict exposure as the accounting step above (D-342):
            # this commit also carries the three whole-file aggregates, so a
            # concurrent run makes the rebase fail rather than fast-forward.
            attempt=1
            until git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}"; do
              git rebase --abort 2>/dev/null || true
              attempt=$((attempt + 1))
              if [ "$attempt" -gt 3 ]; then
                echo "::error::proposals could not be pushed after 3 attempts. They are \
                valid and were produced by a successful run; re-run the commit against a \
                quiet branch. Spend is unaffected — its receipt committed separately."
                exit 1
              fi
              sleep $((attempt * 5))
            done
          else
            echo "No novel grounded proposals — nothing to commit."
          fi

      # ---------- A broken ledger fails the job, after the spend is safe ------
      # D-132: an unbalanced run cannot say what it did, so every number it
      # reports is unsound and the run must not read as green. This runs last,
      # so the accounting is already committed by the time the job goes red.
      - name: Fail the job if the ledger did not balance
        if: always()
        run: |
          set -euo pipefail
          if node -e '
            const { readFileSync } = require("node:fs");
            const m = JSON.parse(readFileSync("corpora/extraction/manifest.json", "utf8"));
            const runs = [...(m.last_run ? [m.last_run] : []), ...(m.run_history ?? [])];
            const mine = runs.filter((r) => r.github_run_id === Number(process.env.GITHUB_RUN_ID));
            const broken = mine.filter((r) => r.status === "broken");
            if (broken.length > 0) {
              console.error(`ledger did not balance for ${broken.length} run entry/entries`);
              process.exit(1);
            }
          '; then
            echo "Candidate ledger balanced."
          else
            echo "::error::candidate ledger did not balance — the run is BROKEN (D-132). \
            Its spend IS committed and its manifest entry says broken; the funnel numbers \
            it reports are not trustworthy. Diagnose before reading its yield."
            exit 1
          fi
