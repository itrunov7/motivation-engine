# ─────────────────────────────────────────────
# LAYER 1 — MECHANISMS (atoms of evidence)
# ─────────────────────────────────────────────
mechanisms:

  - id: SP-08
    name: social proof
    fact: When unsure, people look to what others do and treat it as evidence of the right choice.
    grade: A-
    source: People use others' behavior as evidence for the correct action, especially under uncertainty (Asch conformity; Cialdini's focus theory of normative conduct). Descriptive norms reliably shift behavior; online reviews measurably affect purchasing.; doi:10.1037/h0093718; doi:10.1037/0022-3514.58.6.1015; doi:10.1509/jmkg.73.4.15
    boundary: strongest under uncertainty; referent similarity matters; boomerang effect if norm is undesirable
    active_when: product.has_real_social_signal
    realizations: [usage-signal, choice-signal]
    forbidden: [real-social-data, no-fake-activity, no-fake-reviews]

  - id: FR-11
    name: framing & anchoring
    fact: The same facts land differently depending on how they are framed and what reference point they are compared against.
    grade: B+
    source: "Framing: how equivalent information is presented shifts choice (Tversky & Kahneman 1981; Levin's attribute/risky/goal framing typology). Anchoring: an initial reference value biases subsequent estimates (Tversky & Kahneman 1974). Both robust, but anchoring's magnitude and some subliminal/incidental variants have a contested replication record.; doi:10.1126/science.7455683; doi:10.1126/science.185.4157.1124; doi:10.1257/aer.104.5.277"
    boundary: anchoring replication contested for incidental variants; framing strength varies by type; effect sizes paradigm dependent
    active_when: artifact.presents_choice_or_price
    realizations: [price-anchor, gain-loss-framing]
    forbidden: [real-anchor-only, truthful-framing, no-deceptive-decoy]

# ─────────────────────────────────────────────
# CROSS-CUTTING — PERCEPTION & COMPREHENSION (S7 · applies to every element)
# ─────────────────────────────────────────────
cross_cutting_perception:

  [] # fills automatically when S7 seeds are promoted to full records (docs/s7-drafting-brief.md); pack-map needs no change (D-066)

# ─────────────────────────────────────────────
# LAYER 2 — INTERACTIONS (often stronger than any single mechanism)
# ─────────────────────────────────────────────
interactions:

  - combination: [FR-11, SP-08]
    type: reinforcing
    fact: "Social signals function simultaneously as evidence and as reference points: a 'most popular' or 'most chosen' marker acts as social proof and as an anchor/default in the same element, so the two mechanisms operate on one cue rather than competing for attention. Under uncertainty this compounds — the socially validated option becomes both the safe choice and the reference against which alternatives are judged."
    grade: B
    boundary: "Shared failure mode: both mechanisms depend on the credibility of the same cue. If the social signal or the reference is perceived as manufactured (fabricated counts, a 'recommended' tier chosen for margin rather than genuine selection data), reactance suppresses BOTH — the combined effect turns negative faster than either alone. Effect is strongest at choice points under genuine uncertainty; weak where the user already has a formed preference."
    source: Cialdini, Reno & Kallgren (1990) focus theory of normative conduct, doi:10.1037/0022-3514.58.6.1015; Tversky & Kahneman (1974) anchoring, doi:10.1126/science.185.4157.1124. Interaction claim is inferred from the convergence of these literatures at a shared cue — graded B accordingly, not A.

# ─────────────────────────────────────────────
# LAYER 3 — CONTEXT WEIGHTS (what fits what)
# ─────────────────────────────────────────────
context_weights:
  - context: product.has_real_social_signal
    strong: [SP-08]
  - context: not (product.has_real_social_signal)
    inactive: [SP-08]
  - context: artifact.presents_choice_or_price
    strong: [FR-11]
  - context: not (artifact.presents_choice_or_price)
    inactive: [FR-11]

# ─────────────────────────────────────────────
# HARD BOUNDARIES (absolute — legal/policy status, not preference)
# ─────────────────────────────────────────────
hard_boundaries:
  - real-social-data: forbidden — All social-proof signals (counts, ratings, 'most popular', reviews) must be genuine and current; fabricated or inflated social proof is forbidden
  - no-fake-activity: forbidden — No fake 'X people viewing/bought recently' notifications unless literally true and verifiable
  - no-fake-reviews: forbidden — generate, imply, or display fabricated reviews or testimonials
  - real-anchor-only: forbidden — Anchors (reference prices, tiers, 'was' prices) must be genuine; fabricated anchors and fake original prices are forbidden and often illegal
  - truthful-framing: forbidden — Framing selects emphasis among true statements; it must never misrepresent, omit material negatives deceptively, or state falsehoods
  - no-deceptive-decoy: forbidden — Decoy/reference options must be real offerings, not fake options designed solely to mislead
  - boundary_test: Is the social signal true and relevant — or manufactured to fake consensus?
  - boundary_test: Is the frame emphasizing true value with a real reference point — or manufacturing a misleading comparison?

