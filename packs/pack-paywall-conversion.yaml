# ─────────────────────────────────────────────
# LAYER 1 — MECHANISMS (atoms of evidence)
# ─────────────────────────────────────────────
mechanisms:

  - id: LA-01
    name: loss aversion
    fact: A loss is experienced ~2x more intensely than an equivalent gain.
    grade: A
    source: Prospect theory (Kahneman & Tversky 1979); Nobel Prize 2002; cross-cultural replications over 45 years; doi:10.1017/S1930297500005945; doi:10.1037/xge0000039
    boundary: weak on small stakes; requires perceived ownership; contested by Gal & Rucker, 'The Loss of Loss Aversion' (Journal of Consumer Psychology, 2018, DOI 10.1002/jcpy.1047)
    active_when: user.accumulated_value_score > 0
    realizations: [streak, trial-ownership, cancel-inventory, expiring-value, copy-framing]
    forbidden: [real-loss-only, no-confirm-shaming, no-data-hostage, panic-cap, precondition-gate]

  - id: EN-03
    name: endowment effect
    fact: Once something is 'mine', I value it more highly than I would to acquire it — parting with it is coded as a loss (endowment is upstream of LA-01).
    grade: A-
    source: Kahneman, Knetsch & Thaler (1990) mug experiments; Thaler (1980) coined the term; integrative review Morewedge & Giblin (2015). Robust and widely replicated.; doi:10.1086/261737; doi:10.1257/0002828054825547; doi:10.1016/j.tics.2015.04.004
    boundary: procedure sensitive; attenuates with market experience; weaker for goods held for exchange
    active_when: user.has_created_or_customized_artifact OR product.has_trial
    realizations: [user-creation-preview, personalization-investment, trial-possession]
    forbidden: [real-ownership-only, no-forced-investment, honest-trial-scope]

  - id: FR-11
    name: framing & anchoring
    fact: The same facts land differently depending on how they are framed and what reference point they are compared against.
    grade: B+
    source: "Framing: how equivalent information is presented shifts choice (Tversky & Kahneman 1981; Levin's attribute/risky/goal framing typology). Anchoring: an initial reference value biases subsequent estimates (Tversky & Kahneman 1974). Both robust, but anchoring's magnitude and some subliminal/incidental variants have a contested replication record.; doi:10.1126/science.7455683; doi:10.1126/science.185.4157.1124; doi:10.1257/aer.104.5.277"
    boundary: anchoring replication contested for incidental variants; framing strength varies by type; effect sizes paradigm dependent
    active_when: artifact.presents_choice_or_price
    realizations: [price-anchor, gain-loss-framing]
    forbidden: [real-anchor-only, truthful-framing, no-deceptive-decoy]

  - id: SC-06
    name: scarcity
    fact: Limited availability raises perceived value and urgency — but only when the scarcity is real and credible.
    grade: B
    source: Scarcity raises perceived value and can increase compliance/desirability (Worchel, Lee & Adewole 1975; Lynn 1991 quantitative review of commodity theory). Effect is real but moderated heavily by type (limited-quantity vs limited-time), perceived cause of scarcity, and context; not a strong universal.; doi:10.1002/mar.4220080204; doi:10.1037/0022-3514.32.5.906
    boundary: type dependent quantity vs time; backfires if perceived as manipulation; weaker and more variable than core mechanisms
    active_when: product.has_genuine_limit
    realizations: [real-limited-quantity, real-deadline]
    forbidden: [genuine-scarcity-only, no-fake-timers, no-manufactured-limits]

