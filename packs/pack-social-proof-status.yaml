# ─────────────────────────────────────────────
# LAYER 1 — MECHANISMS (atoms of evidence)
# ─────────────────────────────────────────────
mechanisms:

  - id: SP-08
    name: social proof
    fact: When unsure, people look to what others do and treat it as evidence of the right choice.
    grade: A-
    source: People use others' behavior as evidence for the correct action, especially under uncertainty (Asch conformity; Cialdini's focus theory of normative conduct). Descriptive norms reliably shift behavior; online reviews measurably affect purchasing.; doi:10.1037/h0093718; doi:10.1037/0022-3514.58.6.1015; doi:10.1509/jmkg.73.4.15
    boundary: strongest under uncertainty; referent similarity matters; boomerang effect if norm is undesirable
    active_when: product.has_real_social_signal
    realizations: [usage-signal, choice-signal]
    forbidden: [real-social-data, no-fake-activity, no-fake-reviews]

  - id: ST-09
    name: status & comparison
    fact: People are motivated by their standing relative to others — progress, rank, recognition among a relevant peer group.
    grade: A-
    source: People evaluate themselves relative to others and are motivated by relative standing (Festinger 1954, social comparison theory). Status-seeking and positional/conspicuous consumption are well-documented in economics and consumer behavior (Veblen effects).; doi:10.1177/001872675400700202; doi:10.2307/2946511
    boundary: upward comparison can demotivate or harm wellbeing; referent group dependent; status signals are culturally specific
    active_when: product.has_progress_or_achievement
    realizations: [progress-recognition, peer-standing]
    forbidden: [no-harmful-comparison, real-achievement, comparison-opt-out, vulnerable-wellbeing]

# ─────────────────────────────────────────────
# LAYER 2 — INTERACTIONS (often stronger than any single mechanism)
# ─────────────────────────────────────────────
interactions:

  - combination: [SP-08, ST-09]
    type: noted
    fact: Social proof (others as evidence) is distinct from status/comparison (standing relative to others); they co-occur but differ in driver
    grade: A-

# ─────────────────────────────────────────────
# LAYER 3 — CONTEXT WEIGHTS (what fits what)
# ─────────────────────────────────────────────
context_weights:
  - context: product.has_real_social_signal
    strong: [SP-08]
  - context: not (product.has_real_social_signal)
    inactive: [SP-08]
  - context: product.has_progress_or_achievement
    strong: [ST-09]
  - context: not (product.has_progress_or_achievement)
    inactive: [ST-09]

# ─────────────────────────────────────────────
# HARD BOUNDARIES (absolute — legal/policy status, not preference)
# ─────────────────────────────────────────────
hard_boundaries:
  - real-social-data: forbidden — All social-proof signals (counts, ratings, 'most popular', reviews) must be genuine and current; fabricated or inflated social proof is forbidden
  - no-fake-activity: forbidden — No fake 'X people viewing/bought recently' notifications unless literally true and verifiable
  - no-fake-reviews: forbidden — generate, imply, or display fabricated reviews or testimonials
  - no-harmful-comparison: forbidden — engineer demoralizing or wellbeing-damaging comparison (permanent bottom-ranking, shaming, appearance/self-worth comparison); comparison must motivate, not harm
  - real-achievement: forbidden — Status and achievement signals must reflect genuine accomplishment, not fabricated or purchased rank presented as merit
  - comparison-opt-out: forbidden — Public ranking/comparison must be opt-out-able; do not force users into visible competition
  - vulnerable-wellbeing: forbidden — intensify social comparison toward users where it risks wellbeing harm (e.g. appearance, body, self-worth domains)
  - boundary_test: Is the social signal true and relevant — or manufactured to fake consensus?
  - boundary_test: Does the comparison recognize and motivate through attainable standing — or shame, demoralize, or harm wellbeing?

