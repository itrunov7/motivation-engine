  learning: weak/negative signal demotes a realization; strong signal spreads it — the palette evolves from outcomes

# ─────────────────────────────────────────────
# wiring (only human-facing section; not read at generation time)
# ─────────────────────────────────────────────
wiring:
  where: planning stage of the Development Plan, when the planned element matches applies_to
  how: pack provides L1/L2 knowledge plus owner-authored L3 realization directives to the generator
  selection_now: by element type
  selection_later: planning agent pre-filters mechanisms via active_when against the product spec, narrowing the evidence in context
  provenance: downstream of registry records; regenerate when a record's grade/boundary/guardrail changes; never edit independently
