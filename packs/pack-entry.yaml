# ─────────────────────────────────────────────
# LAYER 1 — MECHANISMS (atoms of evidence)
# ─────────────────────────────────────────────
mechanisms:

  - id: CG-05
    name: curiosity gap
    fact: A gap between what someone knows and what they want to know creates a pull to close it.
    grade: B+
    source: Curiosity arises from an information gap between what one knows and wants to know; the gap creates a drive to close it (Loewenstein 1994, information-gap theory). Neuroscience links curiosity states to reward and memory circuitry (Gruber, Kang et al.).; doi:10.1037/0033-2909.116.1.75; doi:10.1016/j.neuron.2014.08.060
    boundary: gap must be moderate known enough to care; clickbait backlash if payoff disappoints; attention effect stronger than lasting engagement
    active_when: artifact.can_pose_a_resolvable_question
    realizations: [personalized-reveal, progressive-reveal]
    forbidden: [real-payoff, no-deceptive-teaser]

  - id: SP-08
    name: social proof
    fact: When unsure, people look to what others do and treat it as evidence of the right choice.
    grade: A-
    source: People use others' behavior as evidence for the correct action, especially under uncertainty (Asch conformity; Cialdini's focus theory of normative conduct). Descriptive norms reliably shift behavior; online reviews measurably affect purchasing.; doi:10.1037/h0093718; doi:10.1037/0022-3514.58.6.1015; doi:10.1509/jmkg.73.4.15
    boundary: strongest under uncertainty; referent similarity matters; boomerang effect if norm is undesirable
    active_when: product.has_real_social_signal
    realizations: [usage-signal, choice-signal]
    forbidden: [real-social-data, no-fake-activity, no-fake-reviews]

  - id: FR-11
    name: framing & anchoring
    fact: The same facts land differently depending on how they are framed and what reference point they are compared against.
    grade: B+
    source: "Framing: how equivalent information is presented shifts choice (Tversky & Kahneman 1981; Levin's attribute/risky/goal framing typology). Anchoring: an initial reference value biases subsequent estimates (Tversky & Kahneman 1974). Both robust, but anchoring's magnitude and some subliminal/incidental variants have a contested replication record.; doi:10.1126/science.7455683; doi:10.1126/science.185.4157.1124; doi:10.1257/aer.104.5.277"
    boundary: anchoring replication contested for incidental variants; framing strength varies by type; effect sizes paradigm dependent
    active_when: artifact.presents_choice_or_price
    realizations: [price-anchor, gain-loss-framing]
    forbidden: [real-anchor-only, truthful-framing, no-deceptive-decoy]

  - id: RE-10
    name: reciprocity
    fact: Receiving something creates a felt obligation to give back.
    grade: B+
    source: The reciprocity norm — a felt obligation to return benefits received — is a broadly documented social rule (Gouldner 1960) and underlies compliance techniques like door-in-the-face (Cialdini). Field experiments (gift-exchange) show reciprocal behavior reliably.; doi:10.2307/2092623; doi:10.1037/0022-3514.31.2.206
    boundary: gift must feel genuine not transactional; effect weakens if perceived as manipulation; obligation can feel coercive if overused
    active_when: product.can_give_genuine_value_first
    realizations: [value-first, unexpected-upgrade]
    forbidden: [genuine-gift, no-coercive-obligation, no-unwanted-gifts-as-leverage]

# ─────────────────────────────────────────────
# CROSS-CUTTING — PERCEPTION & COMPREHENSION (S7 · applies to every element)
# ─────────────────────────────────────────────
cross_cutting_perception:

  - id: CL-14
    name: cognitive load
    fact: "Working memory is narrow: only a few elements can be held and related at once."
    grade: A
    source: Working memory processes only a few elements at once (Baddeley 1974); when presentation consumes that capacity with load unrelated to the task (extraneous load), comprehension and performance degrade. Sweller 1988 and the 1998 architecture paper established the framework; split-attention (Chandler & Sweller 1991) and the 20-years-later review (Sweller et al. 2019) sustain it across four decades.; doi:10.1207/s15516709cog1202_4; doi:10.1023/A:1022193728205
    boundary: expertise reversal what helps novices can hurt experts; load measurement relies on subjective scales; germane load construct contested; evidence base is instructional not commercial interfaces
    active_when: ""
    realizations: [extraneous-reduction, chunking-progressive-disclosure, split-attention-avoidance]
    forbidden: [no-load-as-obstruction, no-essential-omission]

  - id: IF-18
    name: information foraging
    fact: Users do not read to find what they want; they follow cues that predict where it is.
    grade: B+
    source: "People seeking information behave like foragers: they judge, from local cues, whether a path is likely to lead to what they want ('information scent'), pursue high-scent paths, and abandon low-scent ones — behaviour governed by a cost–benefit calculus rather than exhaustive reading. Pirolli & Card (1999) formalised the theory; computational models (SNIF-ACT) predict navigation choices from scent, and applied work (the scent-of-a-site analyses, scented widgets) tests scent manipulation directly.; doi:10.1037/0033-295X.106.4.643"
    boundary: validated mainly on hypertext search and browse tasks; computational models validated on limited datasets; less established for feeds apps and mobile; scent is a perception and can be wrong
    active_when: artifact.has_navigation_or_choice_between_paths
    realizations: [specific-predictive-labels, preview-cues]
    forbidden: [no-false-scent, no-scent-suppression-for-exit-paths]

  - id: MM-15
    name: multimedia design principles
    fact: How words and images are combined determines whether anything is understood.
    grade: A
    source: "Three decades of controlled experiments on how words and images should be combined. Established principles with the strongest support: multimedia (words plus relevant images beat words alone), coherence (removing interesting-but-extraneous material improves understanding — Mayer, Heiser & Lonn 2001), signalling (cueing the essential improves outcomes — Richter, Scheiter & Eitel meta-analysis), spatial and temporal contiguity (Ginns meta-analysis), and redundancy (duplicating identical content across channels harms rather than helps).; doi:10.1207/S15326985EP3801_6; doi:10.1017/CBO9781139547369"
    boundary: evidence base is learning outcomes not conversion; expertise reversal applies; redundancy effect has boundary conditions; richer media not automatically better
    active_when: artifact.conveys_explanatory_content
    realizations: [multimedia-substitution, coherence-pruning, signaling, contiguity-and-redundancy]
    forbidden: [no-explanatory-omission, no-misleading-visual, accessibility-preserved]

  - id: PF-16
    name: processing fluency
    fact: "When something is easy to read, see or grasp, that ease is felt as a mild positive signal and is attributed to the thing itself rather than to the processing: fluent material is liked more, trusted more and judged more true."
    grade: A-
    source: "Ease of mental processing is experienced as a positive feeling and is misattributed to the object being processed: fluently processed material is judged more likeable, more familiar, more confidently, and — critically — more true. Reber, Schwarz & Winkielman (2004) for aesthetic preference; Alter & Oppenheimer (2009) integrating the fluency literatures; Dechêne et al. (2009) meta-analysis of the truth effect.; doi:10.1207/s15327957pspr0804_3; doi:10.1177/1088868309341564"
    boundary: fluency signal meaning is learned not fixed; measurement of fluency contested; disfluency preferred in some contexts; truth effect is an ethical hazard not a tool
    active_when: ""
    realizations: [legibility-and-plain-language, familiar-structure]
    forbidden: [no-fluency-for-false-claims, no-disfluency-obstruction, material-information-fluent]

  - id: PS-13
    name: picture superiority
    fact: An image of a concrete thing is remembered better than its name, and is recognised faster.
    grade: A-
    source: Pictures of concrete things are recognised and recalled better than the words naming them — the picture superiority effect, one of the most reliably reproduced findings in memory research. Paivio's dual coding account (verbal and imaginal systems encoding separately, giving pictures two routes) is the classic explanation and remains the standard applied framing.; doi:10.1093/acprof:oso/9780195066661.001.0001; doi:10.1007/BF01320076
    boundary: holds for concrete nameable items not abstract content; text superior for precise sequential technical information; dual coding explanation contested even where effect holds; memory advantage is not automatically a comprehension or conversion advantage
    active_when: content.is_concrete_depictable
    realizations: [show-the-outcome, visual-state-encoding]
    forbidden: [no-replacing-precise-information, image-must-be-content, no-misleading-depiction, accessibility-preserved]

  - id: SC-17
    name: scanning & visual attention
    fact: People do not read interfaces; they sample them.
    grade: B
    source: Interfaces are not read linearly. Initial visual judgements form within tens of milliseconds and are highly consistent (Lindgaard et al. 2006; Tractinsky et al. on immediate aesthetic perception), attention is allocated selectively by visual salience and expected relevance, and elements that look like advertising are systematically avoided regardless of their content (advertising-avoidance and banner-blindness literature).; doi:10.1080/01449290500330448; doi:10.1080/00913367.2004.10639175
    boundary: specific scan patterns are task and layout dependent; much practitioner canon is folklore from small samples; findings predate or ignore mobile and feed interfaces; banner blindness reducible by relevance and native placement
    active_when: ""
    realizations: [single-dominant-element, front-loaded-meaning, avoid-ad-resemblance]
    forbidden: [no-disguised-advertising, no-hidden-material-information, no-attention-hijacking]

# ─────────────────────────────────────────────
# LAYER 2 — INTERACTIONS (often stronger than any single mechanism)
# ─────────────────────────────────────────────
interactions:

  - combination: [CG-05, FR-11]
    type: reinforcing
    fact: "Curiosity depends on the reference point the question is framed against. In information-gap theory the drive scales with awareness of what one does not know: a gap framed too broadly reads as unanswerable and produces no pull, one framed as trivially known produces none either. Curiosity is highest at intermediate perceived knowledge — which makes the framing of the question, not the question itself, the operative variable."
    grade: C+
    boundary: Inferred from Loewenstein's account of gap salience rather than from a study of the two mechanisms combined. The inverted-U over perceived knowledge is theory-supported but its precise shape in applied contexts is not well established; framing that misrepresents what will be revealed collapses the effect and damages trust.
    source: Loewenstein 1994 doi:10.1037/0033-2909.116.1.75 (information-gap theory, gap salience); Tversky & Kahneman 1981 doi:10.1126/science.7455683 (framing). Interaction claim is inferred.

  - combination: [CG-05, RE-10]
    type: sequence-amplifying
    fact: "An opened curiosity gap that is closed with genuinely useful information delivers value before anything is asked — which is the precondition for reciprocity. The sequence matters: the gap creates attention, the resolution creates the gift, and only then does an ask land on an obligation. The same sequence with a hollow resolution inverts it — an unmet gap is experienced as a taking rather than a giving, and generates reactance instead of obligation."
    grade: C
    boundary: Inference; no direct study of the pair. Depends entirely on the resolution being independently valuable — the reciprocity component is carried by the value delivered, not by the curiosity. Clickbait is the failure case of this exact pairing.
    source: Loewenstein 1994 doi:10.1037/0033-2909.116.1.75; Gouldner 1960 doi:10.2307/2092623 (norm of reciprocity). Interaction claim is inferred convergence.

  - combination: [CG-05, SP-08]
    type: reinforcing
    fact: "Social signals act as curiosity triggers as well as evidence: knowing that many others found something worthwhile creates a gap about what they found. The social cue both certifies that the answer is worth having and marks that one does not yet have it — the two mechanisms load the same cue from different directions."
    grade: C+
    boundary: "Inferred convergence, not a studied interaction. Shares a failure mode with any social cue: if the popularity signal is not credible, both the evidential and the curiosity value collapse together. Weak where the user has a formed opinion of the topic — no gap remains to open."
    source: Loewenstein 1994 doi:10.1037/0033-2909.116.1.75; Cialdini Reno & Kallgren 1990 doi:10.1037/0022-3514.58.6.1015. Interaction claim is inferred.

  - combination: [FR-11, RE-10]
    type: reinforcing
    fact: Whether something free is experienced as a gift or as a transaction is a framing decision, and it determines whether reciprocity engages at all. The same object presented as an unconditional gift generates reciprocal response; presented as a sample with an expected return, it is processed as the opening of a negotiation and the obligation weakens. Reciprocity is thus gated by framing rather than by the value transferred.
    grade: C+
    boundary: Inferred from the gift-exchange and framing literatures rather than a direct test of the pair. Transparent quid-pro-quo framing does not merely weaken the effect — it can trigger reactance. The gift must also be genuinely useful; framing cannot rescue a hollow offering.
    source: Gouldner 1960 doi:10.2307/2092623; Tversky & Kahneman 1981 doi:10.1126/science.7455683; gift-exchange field literature. Interaction claim is inferred.

  - combination: [FR-11, SP-08]
    type: reinforcing
    fact: "Social signals function simultaneously as evidence and as reference points: a 'most popular' or 'most chosen' marker acts as social proof and as an anchor/default in the same element, so the two mechanisms operate on one cue rather than competing for attention. Under uncertainty this compounds — the socially validated option becomes both the safe choice and the reference against which alternatives are judged."
    grade: B
    boundary: "Shared failure mode: both mechanisms depend on the credibility of the same cue. If the social signal or the reference is perceived as manufactured (fabricated counts, a 'recommended' tier chosen for margin rather than genuine selection data), reactance suppresses BOTH — the combined effect turns negative faster than either alone. Effect is strongest at choice points under genuine uncertainty; weak where the user already has a formed preference."
    source: Cialdini, Reno & Kallgren (1990) focus theory of normative conduct, doi:10.1037/0022-3514.58.6.1015; Tversky & Kahneman (1974) anchoring, doi:10.1126/science.185.4157.1124. Interaction claim is inferred from the convergence of these literatures at a shared cue — graded B accordingly, not A.

  - combination: [RE-10, SP-08]
    type: noted
    fact: "Both are social-norm mechanisms but differ: reciprocity is exchange obligation, social proof is others-as-evidence"
    grade: B+

