# ─────────────────────────────────────────────
# LAYER 1 — MECHANISMS (atoms of evidence)
# ─────────────────────────────────────────────
mechanisms:

  - id: CG-05
    name: curiosity gap
    fact: A gap between what someone knows and what they want to know creates a pull to close it.
    grade: B+
    source: Curiosity arises from an information gap between what one knows and wants to know; the gap creates a drive to close it (Loewenstein 1994, information-gap theory). Neuroscience links curiosity states to reward and memory circuitry (Gruber, Kang et al.).; doi:10.1037/0033-2909.116.1.75; doi:10.1016/j.neuron.2014.08.060
    boundary: gap must be moderate known enough to care; clickbait backlash if payoff disappoints; attention effect stronger than lasting engagement
    active_when: artifact.can_pose_a_resolvable_question
    realizations: [personalized-reveal, progressive-reveal]
    forbidden: [real-payoff, no-deceptive-teaser]

  - id: SP-08
    name: social proof
    fact: When unsure, people look to what others do and treat it as evidence of the right choice.
    grade: A-
    source: People use others' behavior as evidence for the correct action, especially under uncertainty (Asch conformity; Cialdini's focus theory of normative conduct). Descriptive norms reliably shift behavior; online reviews measurably affect purchasing.; doi:10.1037/h0093718; doi:10.1037/0022-3514.58.6.1015; doi:10.1509/jmkg.73.4.15
    boundary: strongest under uncertainty; referent similarity matters; boomerang effect if norm is undesirable
    active_when: product.has_real_social_signal
    realizations: [usage-signal, choice-signal]
    forbidden: [real-social-data, no-fake-activity, no-fake-reviews]

  - id: FR-11
    name: framing & anchoring
    fact: The same facts land differently depending on how they are framed and what reference point they are compared against.
    grade: B+
    source: "Framing: how equivalent information is presented shifts choice (Tversky & Kahneman 1981; Levin's attribute/risky/goal framing typology). Anchoring: an initial reference value biases subsequent estimates (Tversky & Kahneman 1974). Both robust, but anchoring's magnitude and some subliminal/incidental variants have a contested replication record.; doi:10.1126/science.7455683; doi:10.1126/science.185.4157.1124; doi:10.1257/aer.104.5.277"
    boundary: anchoring replication contested for incidental variants; framing strength varies by type; effect sizes paradigm dependent
    active_when: artifact.presents_choice_or_price
    realizations: [price-anchor, gain-loss-framing]
    forbidden: [real-anchor-only, truthful-framing, no-deceptive-decoy]

  - id: RE-10
    name: reciprocity
    fact: Receiving something creates a felt obligation to give back.
    grade: B+
    source: The reciprocity norm — a felt obligation to return benefits received — is a broadly documented social rule (Gouldner 1960) and underlies compliance techniques like door-in-the-face (Cialdini). Field experiments (gift-exchange) show reciprocal behavior reliably.; doi:10.2307/2092623; doi:10.1037/0022-3514.31.2.206
    boundary: gift must feel genuine not transactional; effect weakens if perceived as manipulation; obligation can feel coercive if overused
    active_when: product.can_give_genuine_value_first
    realizations: [value-first, unexpected-upgrade]
    forbidden: [genuine-gift, no-coercive-obligation, no-unwanted-gifts-as-leverage]

