# ─────────────────────────────────────────────
# HARD BOUNDARIES (absolute — legal/policy status, not preference)
# ─────────────────────────────────────────────
hard_boundaries:
  - real-payoff: forbidden — The curiosity gap must resolve into genuine, specific value; teasing a reveal the product does not deliver (clickbait) is forbidden
  - no-deceptive-teaser: forbidden — The teased question must honestly represent what will be revealed; misleading curiosity hooks are forbidden
  - real-social-data: forbidden — All social-proof signals (counts, ratings, 'most popular', reviews) must be genuine and current; fabricated or inflated social proof is forbidden
  - no-fake-activity: forbidden — No fake 'X people viewing/bought recently' notifications unless literally true and verifiable
  - no-fake-reviews: forbidden — generate, imply, or display fabricated reviews or testimonials
  - real-anchor-only: forbidden — Anchors (reference prices, tiers, 'was' prices) must be genuine; fabricated anchors and fake original prices are forbidden and often illegal
  - truthful-framing: forbidden — Framing selects emphasis among true statements; it must never misrepresent, omit material negatives deceptively, or state falsehoods
  - no-deceptive-decoy: forbidden — Decoy/reference options must be real offerings, not fake options designed solely to mislead
  - genuine-gift: forbidden — The value given must be genuinely useful on its own; hollow 'gifts' engineered solely to create obligation are forbidden
  - no-coercive-obligation: forbidden — frame the gift as a debt or pressure repayment; reciprocity must remain a free response, not a manufactured obligation
  - no-unwanted-gifts-as-leverage: forbidden — use unsolicited 'gifts' (e.g. forced trials that auto-bill) as reciprocity leverage
  - boundary_test: Does closing the gap give the user something genuinely worth their attention — or is it a bait that disappoints?
  - boundary_test: Is the social signal true and relevant — or manufactured to fake consensus?
  - boundary_test: Is the frame emphasizing true value with a real reference point — or manufacturing a misleading comparison?
  - boundary_test: Is the value given genuinely useful and freely given — or a hollow gift engineered to manufacture obligation?

