# ─────────────────────────────────────────────
# HARD BOUNDARIES (absolute — legal/policy status, not preference)
# ─────────────────────────────────────────────
hard_boundaries:
  - genuine-reward-only: forbidden — The variable reward must deliver real user value; variability that dispenses junk, empty pulls, or manufactured near-misses is forbidden
  - no-gambling-mechanics: forbidden — No loot-box / paid-random-reward / near-miss / loss-disguised-as-win patterns; no monetary or paid-currency randomized rewards
  - no-compulsion-loops: forbidden — engineer intermittent reward to maximize time-on-app against the user's interest; core functionality must never require chasing the variable reward
  - vulnerable-users: forbidden — deploy variable-reward intensification toward users showing compulsive-use signals; no escalation of unpredictability to re-hook lapsing users
  - real-payoff: forbidden — The curiosity gap must resolve into genuine, specific value; teasing a reveal the product does not deliver (clickbait) is forbidden
  - no-deceptive-teaser: forbidden — The teased question must honestly represent what will be revealed; misleading curiosity hooks are forbidden
  - boundary_test: Does the surprise add real value the user is glad to receive — or is it engineered to keep them pulling a lever against their own interest?
  - boundary_test: Does closing the gap give the user something genuinely worth their attention — or is it a bait that disappoints?

