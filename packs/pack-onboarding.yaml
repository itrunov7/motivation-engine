# ─────────────────────────────────────────────
# LAYER 1 — MECHANISMS (atoms of evidence)
# ─────────────────────────────────────────────
mechanisms:

  - id: ID-12
    name: identity & consistency
    fact: People strive to act consistently with who they believe they are and what they've already committed to.
    grade: B+
    source: People are motivated to act consistently with their self-image and prior commitments (self-perception theory, Bem; foot-in-the-door, Freedman & Fraser 1966). Identity-based motivation (Oyserman) shows people act in line with salient identities.; doi:10.1037/h0023552; doi:10.1086/651257
    boundary: foot in the door replication moderate; identity must be genuinely self relevant; backfires if manipulation of self image is detected
    active_when: product.can_elicit_genuine_commitment_or_identity
    realizations: [goal-commitment, identity-salience]
    forbidden: [genuine-commitment-only, no-imposed-identity, no-consistency-trap]

  - id: EN-03
    name: endowment effect
    fact: Once something is 'mine', I value it more highly than I would to acquire it — parting with it is coded as a loss (endowment is upstream of LA-01).
    grade: A-
    source: Kahneman, Knetsch & Thaler (1990) mug experiments; Thaler (1980) coined the term; integrative review Morewedge & Giblin (2015). Robust and widely replicated.; doi:10.1086/261737; doi:10.1257/0002828054825547; doi:10.1016/j.tics.2015.04.004
    boundary: procedure sensitive; attenuates with market experience; weaker for goods held for exchange
    active_when: user.has_created_or_customized_artifact OR product.has_trial
    realizations: [user-creation-preview, personalization-investment, trial-possession]
    forbidden: [real-ownership-only, no-forced-investment, honest-trial-scope]

  - id: ZE-07
    name: progress & incompleteness
    fact: People are pulled to close what is unfinished, and they push harder the closer the goal appears.
    grade: B+
    source: "Goal-gradient: effort accelerates near a goal (Hull 1932; field-validated by Kivetz, Urminsky & Zheng 2006). Endowed-progress effect (Nunes & Dreze 2006). Zeigarnik effect (unfinished tasks stay cognitively active) — real but with mixed replication.; doi:10.1509/jmkr.43.1.39; doi:10.1086/500480"
    boundary: zeigarnik memory effect replication mixed; requires visible attainable goal; false progress backfires if detected
    active_when: product.has_multi_step_goal
    realizations: [progress-indicator, endowed-progress, open-loop]
    forbidden: [true-progress-only, real-headstart-only, attainable-goal, no-manufactured-incompleteness]

  - id: VR-02
    name: variable reward
    fact: Unpredictable rewards drive engagement far more strongly than predictable ones — the brain's dopamine system responds to the *surprise* of reward, not just the reward.
    grade: A
    source: "Variable-ratio schedules produce the highest, most persistent response rates (Skinner). Neural basis: dopamine reward-prediction-error (Schultz, Dayan & Montague 1997) — unpredictable reward drives the strongest dopamine signal.; doi:10.1126/science.275.5306.1593; doi:10.1007/s00213-006-0578-x"
    boundary: reward must be genuinely valued; unpredictability can frustrate if reward never arrives; highest abuse potential of the core set
    active_when: product.has_repeatable_reward_moment
    realizations: [variable-discovery, surprise-reward]
    forbidden: [genuine-reward-only, no-gambling-mechanics, no-compulsion-loops, vulnerable-users]

# ─────────────────────────────────────────────
# CROSS-CUTTING — PERCEPTION & COMPREHENSION (S7 · applies to every element)
# ─────────────────────────────────────────────
cross_cutting_perception:

  - id: CL-14
    name: cognitive load
    fact: "Working memory is narrow: only a few elements can be held and related at once."
    grade: A
    source: Working memory processes only a few elements at once (Baddeley 1974); when presentation consumes that capacity with load unrelated to the task (extraneous load), comprehension and performance degrade. Sweller 1988 and the 1998 architecture paper established the framework; split-attention (Chandler & Sweller 1991) and the 20-years-later review (Sweller et al. 2019) sustain it across four decades.; doi:10.1207/s15516709cog1202_4; doi:10.1023/A:1022193728205
    boundary: expertise reversal what helps novices can hurt experts; load measurement relies on subjective scales; germane load construct contested; evidence base is instructional not commercial interfaces
    active_when: ""
    realizations: [extraneous-reduction, chunking-progressive-disclosure, split-attention-avoidance]
    forbidden: [no-load-as-obstruction, no-essential-omission]

  - id: MM-15
    name: multimedia design principles
    fact: How words and images are combined determines whether anything is understood.
    grade: A
    source: "Three decades of controlled experiments on how words and images should be combined. Established principles with the strongest support: multimedia (words plus relevant images beat words alone), coherence (removing interesting-but-extraneous material improves understanding — Mayer, Heiser & Lonn 2001), signalling (cueing the essential improves outcomes — Richter, Scheiter & Eitel meta-analysis), spatial and temporal contiguity (Ginns meta-analysis), and redundancy (duplicating identical content across channels harms rather than helps).; doi:10.1207/S15326985EP3801_6; doi:10.1017/CBO9781139547369"
    boundary: evidence base is learning outcomes not conversion; expertise reversal applies; redundancy effect has boundary conditions; richer media not automatically better
    active_when: artifact.conveys_explanatory_content
    realizations: [multimedia-substitution, coherence-pruning, signaling, contiguity-and-redundancy]
    forbidden: [no-explanatory-omission, no-misleading-visual, accessibility-preserved]

  - id: PF-16
    name: processing fluency
    fact: "When something is easy to read, see or grasp, that ease is felt as a mild positive signal and is attributed to the thing itself rather than to the processing: fluent material is liked more, trusted more and judged more true."
    grade: A-
    source: "Ease of mental processing is experienced as a positive feeling and is misattributed to the object being processed: fluently processed material is judged more likeable, more familiar, more confidently, and — critically — more true. Reber, Schwarz & Winkielman (2004) for aesthetic preference; Alter & Oppenheimer (2009) integrating the fluency literatures; Dechêne et al. (2009) meta-analysis of the truth effect.; doi:10.1207/s15327957pspr0804_3; doi:10.1177/1088868309341564"
    boundary: fluency signal meaning is learned not fixed; measurement of fluency contested; disfluency preferred in some contexts; truth effect is an ethical hazard not a tool
    active_when: ""
    realizations: [legibility-and-plain-language, familiar-structure]
    forbidden: [no-fluency-for-false-claims, no-disfluency-obstruction, material-information-fluent]

  - id: PS-13
    name: picture superiority
    fact: An image of a concrete thing is remembered better than its name, and is recognised faster.
    grade: A-
    source: Pictures of concrete things are recognised and recalled better than the words naming them — the picture superiority effect, one of the most reliably reproduced findings in memory research. Paivio's dual coding account (verbal and imaginal systems encoding separately, giving pictures two routes) is the classic explanation and remains the standard applied framing.; doi:10.1093/acprof:oso/9780195066661.001.0001; doi:10.1007/BF01320076
    boundary: holds for concrete nameable items not abstract content; text superior for precise sequential technical information; dual coding explanation contested even where effect holds; memory advantage is not automatically a comprehension or conversion advantage
    active_when: content.is_concrete_depictable
    realizations: [show-the-outcome, visual-state-encoding]
    forbidden: [no-replacing-precise-information, image-must-be-content, no-misleading-depiction, accessibility-preserved]

# ─────────────────────────────────────────────
# LAYER 2 — INTERACTIONS (often stronger than any single mechanism)
# ─────────────────────────────────────────────
interactions:

  - combination: [EN-03, VR-02]
    type: reinforcing
    fact: When a variable reward produces something the user keeps — a generated artifact, unlocked state, saved result — the reward stops being a momentary hit and becomes accumulated property. The unpredictable delivery drives the return, the retained output builds the endowment that makes leaving costly. Reward systems that leave nothing behind decay when novelty fades; ones that deposit ownable state compound.
    grade: C+
    boundary: Inference from the convergence of two literatures, not a directly studied interaction — graded accordingly. Requires the variable output to be genuinely retained and personally attributable; a reward the user cannot keep, see, or claim as theirs produces no endowment. Where the reward is purely consumptive (a one-off view), the pair does not apply.
    source: Skinner variable-ratio schedules; Schultz Dayan & Montague 1997 doi:10.1126/science.275.5306.1593 (reward prediction error); Kahneman Knetsch & Thaler 1990 doi:10.1086/261737 (endowment). Interaction claim is inferred convergence.

  - combination: [EN-03, ZE-07]
    type: sequence-amplifying
    fact: "Progress itself becomes owned. The endowed-progress effect is the studied case of exactly this intersection: participants given artificial advancement toward a goal (a card pre-stamped with bonus stamps, same net requirement) completed faster than those starting from zero — the granted progress is treated as a possession worth continuing rather than an empty start. Accumulated progress therefore functions as endowment, which is why abandoning a partially-complete goal feels like giving something up rather than merely stopping."
    grade: B+
    boundary: The head-start must correspond to something real or credibly attributed; participants who perceive the advancement as arbitrary padding show weaker effects. Applies to goals with visible, countable progress — diffuse or unmeasurable goals do not accumulate ownable progress.
    source: "Nunes & Dreze 2006 doi:10.1086/500480 (endowed progress effect — the directly studied intersection); Kivetz Urminsky & Zheng 2006 doi:10.1509/jmkr.43.1.39; endowment: KKT 1990 doi:10.1086/261737."

  - combination: [ID-12, VR-02]
    type: reinforcing
    fact: "Rewards that confirm a self-image the user has declared are processed differently from generic rewards: identity-based motivation holds that people act in line with salient identities, so an unpredictable reward that reads as evidence of being the kind of person they said they are ('you're building something') carries motivational weight beyond its face value. Rewards inconsistent with the declared identity are discounted or ignored."
    grade: C+
    boundary: Inference from identity-based motivation applied to reward structure, not a studied pair. Requires a genuinely self-chosen identity or goal — an imposed label does not confer the effect and can produce resistance. Effect is weak where the identity is peripheral to the user's self-concept.
    source: Oyserman 2009 doi:10.1086/651257 (identity-based motivation); Schultz Dayan & Montague 1997 doi:10.1126/science.275.5306.1593. Interaction claim is inferred.

  - combination: [VR-02, ZE-07]
    type: reinforcing
    fact: Uncertainty about the size or nature of a reward can motivate goal pursuit more than a certain reward of equal or greater expected value — the motivating-uncertainty effect — but only while the person is actively engaged in pursuit rather than deliberating whether to start. Within a progress structure, variable rewards along the path sustain effort; at the decision to begin, uncertainty suppresses.
    grade: B
    boundary: "Directional reversal is the key constraint: uncertain rewards demotivate at the deliberation stage and motivate during pursuit. Effect also depends on the uncertainty being resolvable and the pursuit being ongoing; open-ended uncertainty with no resolution point produces fatigue rather than drive."
    source: "Shen, Fishbach & Hsee 2015, The Motivating-Uncertainty Effect, J Consumer Research doi:10.1086/679418 (directly studied); goal-gradient: Kivetz et al. 2006 doi:10.1509/jmkr.43.1.39."

  - combination: [ID-12, EN-03]
    type: noted
    fact: "'Mine' (endowment) shades into 'part of who I am' (identity); distinct drivers — ownership valuation vs self-consistency"
    grade: B+

  - combination: [ID-12, ZE-07]
    type: noted
    fact: A stated goal creates a progress target; distinct — ID-12 is self-consistency, ZE-07 is goal-gradient progress
    grade: B+

