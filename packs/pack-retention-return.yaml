# ─────────────────────────────────────────────
# HARD BOUNDARIES (absolute — legal/policy status, not preference)
# ─────────────────────────────────────────────
hard_boundaries:
  - genuine-value-habit: forbidden — The habitual action must deliver real user value; do not build habits around actions that serve engagement metrics but not the user
  - cue-not-harassment: forbidden — Cues must be helpful reminders, not manipulative or high-frequency nagging; respect notification limits and user control over cues
  - no-compulsion: forbidden — engineer habit loops that the user cannot easily stop or that work against their stated intent; habit support, not compulsion
  - real-loss-only: forbidden — The loss must be real; fake discounts and fake timers are forbidden
  - no-confirm-shaming: forbidden — Buttons that shame refusal ('No, I want to pay more') are forbidden
  - no-data-hostage: forbidden — Deleting user data is never used as pressure; genuine deletion requires ≥30-day notice and export
  - panic-cap: forbidden — Loss-framed pushes ≤ 1/day, no anxiety escalation
  - precondition-gate: forbidden — When accumulated_value_score = 0, the mechanism is not applied
  - true-progress-only: forbidden — Displayed progress must reflect real state; fabricated or inflated progress bars are forbidden
  - real-headstart-only: forbidden — Endowed progress must correspond to something the user actually did or received; inventing fake completed steps is forbidden
  - attainable-goal: forbidden — The goal must be genuinely reachable; do not create endless or moving goalposts that never complete
  - no-manufactured-incompleteness: forbidden — artificially fragment or leave things incomplete solely to create tension; open loops must be real, user-relevant unfinished states
  - boundary_test: Is this building a habit the user wants and benefits from — or engineering compulsive return against their interest?
  - boundary_test: If the user learned exactly how this works, would they shrug — or feel deceived?
  - boundary_test: Is the progress and the goal real and reachable — or is completion engineered to always recede?

