signals:
  measured: [activation_rate, average_plan_value, click_through, completion_rate, conversion_after_gift, cvr, cvr_frame_a_vs_b, flow_start_rate, landing_engagement, open_rate, retention_lift, signup_rate, tier_selection_distribution, trust_signal_engagement]
  tag: each generated element carries its mechanism id
  learning: weak/negative signal demotes a realization; strong signal spreads it — the palette evolves from outcomes

