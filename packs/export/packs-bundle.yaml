signals:
  measured: [activation_rate, d7_retention, engagement_depth, feature_adoption, goal_progress, onboarding_completion, retention, return_rate, return_rate_without_push, sessions_per_week, task_completion_rate, trial_to_paid_cvr]
  tag: each generated element carries its mechanism id
  learning: weak/negative signal demotes a realization; strong signal spreads it — the palette evolves from outcomes

