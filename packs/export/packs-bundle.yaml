# ─────────────────────────────────────────────
# LAYER 1 — MECHANISMS (atoms of evidence)
# ─────────────────────────────────────────────
mechanisms:

  - id: LA-01
    name: loss aversion
    fact: A loss is experienced ~2x more intensely than an equivalent gain.
    grade: A
    source: Prospect theory (Kahneman & Tversky 1979); Nobel Prize 2002; cross-cultural replications over 45 years; doi:10.1017/S1930297500005945; doi:10.1037/xge0000039
    boundary: weak on small stakes; requires perceived ownership; contested by Gal & Rucker, 'The Loss of Loss Aversion' (Journal of Consumer Psychology, 2018, DOI 10.1002/jcpy.1047)
    active_when: user.accumulated_value_score > 0
    forbidden: [real-loss-only, no-confirm-shaming, no-data-hostage, panic-cap, precondition-gate]

  - id: EN-03
    name: endowment effect
    fact: Once something is 'mine', I value it more highly than I would to acquire it — parting with it is coded as a loss (endowment is upstream of LA-01).
    grade: A-
    source: Kahneman, Knetsch & Thaler (1990) mug experiments; Thaler (1980) coined the term; integrative review Morewedge & Giblin (2015). Robust and widely replicated.; doi:10.1086/261737; doi:10.1257/0002828054825547; doi:10.1016/j.tics.2015.04.004
    boundary: procedure sensitive; attenuates with market experience; weaker for goods held for exchange
    active_when: user.has_created_or_customized_artifact OR product.has_trial
    forbidden: [real-ownership-only, no-forced-investment, honest-trial-scope]

  - id: FR-11
    name: framing & anchoring
    fact: The same facts land differently depending on how they are framed and what reference point they are compared against.
    grade: B+
    source: "Framing: how equivalent information is presented shifts choice (Tversky & Kahneman 1981; Levin's attribute/risky/goal framing typology). Anchoring: an initial reference value biases subsequent estimates (Tversky & Kahneman 1974). Both robust, but anchoring's magnitude and some subliminal/incidental variants have a contested replication record.; doi:10.1126/science.7455683; doi:10.1126/science.185.4157.1124; doi:10.1257/aer.104.5.277"
    boundary: anchoring replication contested for incidental variants; framing strength varies by type; effect sizes paradigm dependent
    active_when: artifact.presents_choice_or_price
    forbidden: [real-anchor-only, truthful-framing, no-deceptive-decoy]

  - id: SC-06
    name: scarcity
    fact: Limited availability raises perceived value and urgency — but only when the scarcity is real and credible.
    grade: B
    source: Scarcity raises perceived value and can increase compliance/desirability (Worchel, Lee & Adewole 1975; Lynn 1991 quantitative review of commodity theory). Effect is real but moderated heavily by type (limited-quantity vs limited-time), perceived cause of scarcity, and context; not a strong universal.; doi:10.1002/mar.4220080204; doi:10.1037/0022-3514.32.5.906
    boundary: type dependent quantity vs time; backfires if perceived as manipulation; weaker and more variable than core mechanisms
    active_when: product.has_genuine_limit
    forbidden: [genuine-scarcity-only, no-fake-timers, no-manufactured-limits]

# ─────────────────────────────────────────────
# CROSS-CUTTING — PERCEPTION & COMPREHENSION (S7 · applies to every element)
# ─────────────────────────────────────────────
cross_cutting_perception:

  - id: CL-14
    name: cognitive load
    fact: "Working memory is narrow: only a few elements can be held and related at once."
    grade: A
    source: Working memory processes only a few elements at once (Baddeley 1974); when presentation consumes that capacity with load unrelated to the task (extraneous load), comprehension and performance degrade. Sweller 1988 and the 1998 architecture paper established the framework; split-attention (Chandler & Sweller 1991) and the 20-years-later review (Sweller et al. 2019) sustain it across four decades.; doi:10.1207/s15516709cog1202_4; doi:10.1023/A:1022193728205
    boundary: expertise reversal what helps novices can hurt experts; load measurement relies on subjective scales; germane load construct contested; evidence base is instructional not commercial interfaces
    active_when: ""
    forbidden: [no-load-as-obstruction, no-essential-omission]

  - id: IF-18
    name: information foraging
    fact: Users do not read to find what they want; they follow cues that predict where it is.
    grade: B+
    source: "People seeking information behave like foragers: they judge, from local cues, whether a path is likely to lead to what they want ('information scent'), pursue high-scent paths, and abandon low-scent ones — behaviour governed by a cost–benefit calculus rather than exhaustive reading. Pirolli & Card (1999) formalised the theory; computational models (SNIF-ACT) predict navigation choices from scent, and applied work (the scent-of-a-site analyses, scented widgets) tests scent manipulation directly.; doi:10.1037/0033-295X.106.4.643"
    boundary: validated mainly on hypertext search and browse tasks; computational models validated on limited datasets; less established for feeds apps and mobile; scent is a perception and can be wrong
    active_when: artifact.has_navigation_or_choice_between_paths
    forbidden: [no-false-scent, no-scent-suppression-for-exit-paths]

  - id: MM-15
    name: multimedia design principles
    fact: How words and images are combined determines whether anything is understood.
    grade: A
    source: "Three decades of controlled experiments on how words and images should be combined. Established principles with the strongest support: multimedia (words plus relevant images beat words alone), coherence (removing interesting-but-extraneous material improves understanding — Mayer, Heiser & Lonn 2001), signalling (cueing the essential improves outcomes — Richter, Scheiter & Eitel meta-analysis), spatial and temporal contiguity (Ginns meta-analysis), and redundancy (duplicating identical content across channels harms rather than helps).; doi:10.1207/S15326985EP3801_6; doi:10.1017/CBO9781139547369"
    boundary: evidence base is learning outcomes not conversion; expertise reversal applies; redundancy effect has boundary conditions; richer media not automatically better
    active_when: artifact.conveys_explanatory_content
    forbidden: [no-explanatory-omission, no-misleading-visual, accessibility-preserved]

  - id: PF-16
    name: processing fluency
    fact: "When something is easy to read, see or grasp, that ease is felt as a mild positive signal and is attributed to the thing itself rather than to the processing: fluent material is liked more, trusted more and judged more true."
    grade: A-
    source: "Ease of mental processing is experienced as a positive feeling and is misattributed to the object being processed: fluently processed material is judged more likeable, more familiar, more confidently, and — critically — more true. Reber, Schwarz & Winkielman (2004) for aesthetic preference; Alter & Oppenheimer (2009) integrating the fluency literatures; Dechêne et al. (2009) meta-analysis of the truth effect.; doi:10.1207/s15327957pspr0804_3; doi:10.1177/1088868309341564"
    boundary: fluency signal meaning is learned not fixed; measurement of fluency contested; disfluency preferred in some contexts; truth effect is an ethical hazard not a tool
    active_when: ""
    forbidden: [no-fluency-for-false-claims, no-disfluency-obstruction, material-information-fluent]

  - id: PS-13
    name: picture superiority
    fact: An image of a concrete thing is remembered better than its name, and is recognised faster.
    grade: A-
    source: Pictures of concrete things are recognised and recalled better than the words naming them — the picture superiority effect, one of the most reliably reproduced findings in memory research. Paivio's dual coding account (verbal and imaginal systems encoding separately, giving pictures two routes) is the classic explanation and remains the standard applied framing.; doi:10.1093/acprof:oso/9780195066661.001.0001; doi:10.1007/BF01320076
    boundary: holds for concrete nameable items not abstract content; text superior for precise sequential technical information; dual coding explanation contested even where effect holds; memory advantage is not automatically a comprehension or conversion advantage
    active_when: content.is_concrete_depictable
    forbidden: [no-replacing-precise-information, image-must-be-content, no-misleading-depiction, accessibility-preserved]

  - id: SC-17
    name: scanning & visual attention
    fact: People do not read interfaces; they sample them.
    grade: B
    source: Interfaces are not read linearly. Initial visual judgements form within tens of milliseconds and are highly consistent (Lindgaard et al. 2006; Tractinsky et al. on immediate aesthetic perception), attention is allocated selectively by visual salience and expected relevance, and elements that look like advertising are systematically avoided regardless of their content (advertising-avoidance and banner-blindness literature).; doi:10.1080/01449290500330448; doi:10.1080/00913367.2004.10639175
    boundary: specific scan patterns are task and layout dependent; much practitioner canon is folklore from small samples; findings predate or ignore mobile and feed interfaces; banner blindness reducible by relevance and native placement
    active_when: ""
    forbidden: [no-disguised-advertising, no-hidden-material-information, no-attention-hijacking]

# ─────────────────────────────────────────────
# LAYER 2 — EFFECTS (first-class scientific phenomena)
# ─────────────────────────────────────────────
effects:

  - id: chromatic-asymmetry-in-visual-attention
    mechanism_id: CL-14
    name: Chromatic Asymmetry in Visual Attention
    fact: "There is a systematic dissociation between preattentive capture and sustained processing based on background color: yellow backgrounds optimize rapid initial attentional capture, while black backgrounds optimize sustained reading efficiency."
    grade: C+
    source: ["10.3390/sym18010076"]
    boundary: Standardized reading tasks with white text.
    realization_ids: []

  - id: cl-14-001
    mechanism_id: CL-14
    name: Split-attention effect
    fact: The split-attention effect occurs when students must split their attention between multiple sources of information, which results in a heavy cognitive load.
    grade: C+
    source: ["10.1037/0022-0663.87.2.319"]
    boundary: Instructional design and multimedia learning
    realization_ids: []

  - id: cl-14-002
    mechanism_id: CL-14
    name: Expertise reversal effect
    fact: Instructional techniques that facilitate learning among early learners may not help and may even interfere with learning among more advanced learners.
    grade: C+
    source: ["10.3109/0142159x.2014.889290"]
    boundary: Instructional design for varying levels of learner expertise
    realization_ids: [expertise-based-guidance-toggle]

  - id: cl-14-01
    mechanism_id: CL-14
    name: Imagination Effect
    fact: Imagining a procedure or concept can be a more effective instructional technique than conventional studying, provided the presentation format is integrated rather than split-attention.
    grade: C+
    source: ["10.1002/acp.1061"]
    boundary: Applies to learning procedures or concepts; effectiveness depends on the mode of presentation (integrated vs. split-attention).
    realization_ids: []

  - id: cl14-cueing
    mechanism_id: CL-14
    name: Cueing effect
    fact: Adding visual cues that relate elements of a picture to the text raised retention scores in a learner-paced classroom study, but the same study reports only a weak cueing effect that does not easily generalise to non-laboratory settings.
    grade: C
    source: ["10.1348/000709904322848824"]
    boundary: Learner-paced, non-laboratory multimedia instruction
    realization_ids: []

  - id: tracing-and-pointing
    mechanism_id: CL-14
    name: Tracing and pointing
    fact: Tracing and pointing actions using the index finger on lesson materials enhance learning and reduce extraneous cognitive load.
    grade: C+
    source: ["10.1007/s10648-025-10005-7"]
    boundary: Native Chinese-speaking adult participants learning about the human circulatory system from paper-based materials.
    realization_ids: []

# ─────────────────────────────────────────────
# LAYER 3 — REALIZATIONS (source-grounded evidence palette)
# ─────────────────────────────────────────────
realizations:

  - id: expertise-based-guidance-toggle
    mechanism_id: CL-14
    effect_id: cl-14-002
    term: Expertise-based guidance toggle
    description_as_reported: "Students with no previous domain familiarity with databases were found to substantially benefit from worked examples in comparison to exploration. However, if students had previous familiarity with the database domain, the type of practice made no significant difference to their learning, because the exploration students were able to draw on existing, well-developed domain schemas to guide their exploration. The reported result for experienced learners is an absence of difference, not a decline: this study observed guidance ceasing to pay for itself, and did not observe it interfering with learning."
    artifact_context: ["onboarding", "dashboard_widget"]
    confidence: 0.6
    source_record_ids: [cr_7e6bcb42220d86126199d6e2, cr_f251c717810311c480c7234f]

# ─────────────────────────────────────────────
# IMPLEMENTATIONS (product-authored generator directives)
# ─────────────────────────────────────────────
implementations:

  - id: LA-01-streak
    mechanism_id: LA-01
    artifact_types: [retention_push, dashboard_widget]
    product_requirements: ["has_recurring_user_action"]
    generation_directive: Frame the user's recurring action as a streak with a visible counter. Push/widget triggers on the RISK of the streak resetting; framing is preservation ('Don't lose your 12 days'), not achievement.
    copy_formulas: ["Don't lose your {n}-day streak!", "{n} days in a row — {h} hours left to keep it going"]
    metrics: [d7_retention, d30_retention, push_return_rate_vs_baseline]
    observed_effects: []

  - id: LA-01-trial-ownership
    mechanism_id: LA-01
    artifact_types: [paywall]
    product_requirements: ["has_trial", "user_creates_artifacts"]
    generation_directive: "The paywall shows what the user has CREATED (previews of their projects/results) and frames payment as keeping access to what is theirs, not as a purchase. State a concrete number and deadline: 'Your {n} projects will be deleted in {d} days'."
    copy_formulas: ["Your {n} projects will be deleted in {d} days", "Keep access to your work"]
    metrics: [trial_to_paid_cvr_vs_neutral_paywall]
    observed_effects: []

  - id: LA-01-cancel-inventory
    mechanism_id: LA-01
    artifact_types: [cancellation_flow]
    product_requirements: ["has_subscription"]
    generation_directive: The cancellation screen lists the user's concrete accumulated value (history, status, discount, created objects) with numbers. Neutral tone, no pleading, no shame. Cancel and keep buttons are equally visible.
    copy_formulas: ["If you cancel, you will lose: {value_items}"]
    metrics: [cancel_save_rate]
    observed_effects: []

  - id: LA-01-expiring-value
    mechanism_id: LA-01
    artifact_types: [email, retention_push]
    product_requirements: ["has_points_or_credits"]
    generation_directive: Reminder that accumulated value expires, with a concrete date and amount. Frequency ≤ 2 touches per expiry cycle.
    copy_formulas: ["Your {n} points expire on {date}"]
    metrics: [reactivation_rate_in_expiry_window]
    observed_effects: []

  - id: LA-01-copy-framing
    mechanism_id: LA-01
    artifact_types: [paywall, pricing_page, email, checkout]
    product_requirements: []
    generation_directive: "Where a benefit exists, frame it as loss prevention: 'Stop losing ${x}/month' instead of 'Save ${x}/month'. Apply selectively — no more than 1 loss frame per screen."
    copy_formulas: ["Stop losing ${x} every month"]
    metrics: [cvr_loss_frame_vs_gain_frame]
    observed_effects: []

  - id: EN-03-user-creation-preview
    mechanism_id: EN-03
    artifact_types: [paywall, dashboard_widget]
    product_requirements: ["user_creates_artifacts"]
    generation_directive: "Surface what the user has made as visibly theirs before any ask: 'Your gallery', 'Your workspace', concrete previews of their own outputs. Ownership must be established before LA-01 loss framing is applied (sequence EN-03 -> LA-01)."
    copy_formulas: ["Your {artifact_type} · {n} created", "This is yours"]
    metrics: [trial_to_paid_cvr, activation_rate]
    observed_effects: []

  - id: EN-03-personalization-investment
    mechanism_id: EN-03
    artifact_types: [onboarding]
    product_requirements: []
    generation_directive: Have the user invest small effort early (customize, name, configure, pick preferences) so the product becomes 'theirs'. Investment creates ownership even without a purchase. Keep effort light and clearly rewarded — not a chore.
    copy_formulas: ["Make it yours", "Set up your {thing}"]
    metrics: [onboarding_completion, d7_retention]
    observed_effects: []

  - id: EN-03-trial-possession
    mechanism_id: EN-03
    artifact_types: [paywall, pricing_page]
    product_requirements: ["has_trial"]
    generation_directive: "Frame the trial as already-owned access rather than a sample: the user possesses the full product, and the decision is whether to keep what is theirs. Pairs directly with LA-01-trial-ownership."
    copy_formulas: ["Keep your full access", "Continue with your {product}"]
    metrics: [trial_to_paid_cvr]
    observed_effects: []

  - id: FR-11-price-anchor
    mechanism_id: FR-11
    artifact_types: [pricing_page, paywall]
    product_requirements: ["has_multiple_tiers_or_reference_price"]
    generation_directive: "Present a higher-value reference point before the target option so it is judged favorably: a premium tier shown first, a genuine 'was' price, or a recommended plan highlighted as the anchor. The anchor must be real (a genuinely offered tier or a true prior price) — fabricated anchors and fake 'was' prices are forbidden."
    copy_formulas: ["Most popular · {plan}", "{anchor_price} value for {target_price}"]
    metrics: [cvr, average_plan_value, tier_selection_distribution]
    observed_effects: []

  - id: FR-11-gain-loss-framing
    mechanism_id: FR-11
    artifact_types: [pricing_page, landing_hero, checkout]
    product_requirements: []
    generation_directive: "Frame the value in the terms that make it most salient and truthful — what the user gains, or (paired with LA-01) what they avoid losing. Attribute framing: present the positive attribute ('90% success' not '10% failure') where both are true. Never misrepresent — framing selects emphasis among true statements, it does not distort facts."
    copy_formulas: ["{positive_attribute}", "Everything you get: {inclusions}"]
    metrics: [cvr, cvr_frame_a_vs_b]
    observed_effects: []

  - id: SC-06-real-limited-quantity
    mechanism_id: SC-06
    artifact_types: [checkout, paywall, landing_hero]
    product_requirements: ["has_genuine_quantity_limit"]
    generation_directive: Surface a genuine quantity limit truthfully ('2 slots left this week' when there really are 2). Demand-framed scarcity ('others are booking') is stronger than bare supply, but only state it when true. Never invent counts, never use fake live counters. If there is no real limit, do not apply this mechanism.
    copy_formulas: ["{n} left", "{n} spots remaining this {period}"]
    metrics: [cvr, time_to_purchase]
    observed_effects: []

  - id: SC-06-real-deadline
    mechanism_id: SC-06
    artifact_types: [paywall, pricing_page]
    product_requirements: ["has_genuine_deadline"]
    generation_directive: Communicate a real deadline for a real offer ('this price ends {date}' when it genuinely does). The deadline must be true and not silently reset on reload. Pairs with LA-01 as loss-of-opportunity. Fake countdown timers are forbidden and illegal in many jurisdictions.
    copy_formulas: ["Offer ends {date}", "{time} left at this price"]
    metrics: [cvr, conversion_before_deadline]
    observed_effects: []

  - id: CL-14-extraneous-reduction
    mechanism_id: CL-14
    artifact_types: [landing_hero, paywall, checkout, pricing_page, dashboard_widget]
    product_requirements: []
    generation_directive: "Remove elements that do not serve the current decision or action: decorative content competing for attention, secondary explanations, redundant restatements, unnecessary choices. Every element retained should be justifiable as intrinsic to the task. Reducing extraneous load is not minimalism as taste — it is preserving capacity for the part that matters."
    copy_formulas: []
    metrics: [task_completion_rate, time_to_complete, cvr, error_rate]
    observed_effects: []

  - id: CL-14-chunking-progressive-disclosure
    mechanism_id: CL-14
    artifact_types: [onboarding, checkout, landing_hero, email]
    product_requirements: []
    generation_directive: Split information and input demands into sequenced chunks rather than presenting the full set at once. Reveal detail progressively as it becomes relevant to the step at hand, keeping simultaneous elements few. Long unbroken text and multi-field forms presented in one block impose load that sequencing removes at no cost to completeness.
    copy_formulas: []
    metrics: [onboarding_completion, form_completion_rate, drop_off_by_step]
    observed_effects: []

  - id: CL-14-split-attention-avoidance
    mechanism_id: CL-14
    artifact_types: [onboarding, dashboard_widget, checkout, pricing_page]
    product_requirements: []
    generation_directive: Place related pieces of information together in space and time rather than requiring the user to hold one while searching for the other. Labels adjacent to what they label rather than in a legend; explanation beside the control rather than in a separate section; error message at the field, not summarized elsewhere. Splitting related information forces integration in working memory and measurably degrades performance.
    copy_formulas: []
    metrics: [error_rate, task_completion_rate, time_to_complete]
    observed_effects: []

  - id: IF-18-specific-predictive-labels
    mechanism_id: IF-18
    artifact_types: [landing_hero, dashboard_widget, pricing_page, onboarding, email]
    product_requirements: []
    generation_directive: Write labels, links and headings that state specifically what lies behind them, in the user's own vocabulary rather than internal or invented terms. Generic, clever or branded labels emit no scent and cause abandonment of paths the user actually wanted. The test is whether the label alone predicts the destination.
    copy_formulas: []
    metrics: [navigation_success_rate, task_completion_rate, drop_off_by_step]
    observed_effects: []

  - id: IF-18-preview-cues
    mechanism_id: IF-18
    artifact_types: [dashboard_widget, landing_hero, onboarding]
    product_requirements: []
    generation_directive: Provide cues that let a path be assessed without entering it — counts, previews, summaries, sample content. Reducing the cost of evaluating an option increases exploration of worthwhile paths; where assessment is expensive, users abandon rather than investigate.
    copy_formulas: []
    metrics: [exploration_rate, task_completion_rate, time_to_first_value]
    observed_effects: []

  - id: MM-15-multimedia-substitution
    mechanism_id: MM-15
    artifact_types: [landing_hero, onboarding, pricing_page, email]
    product_requirements: []
    generation_directive: Where the content explains how something works, what a product does, or what a result looks like, present it as relevant image or demonstration together with concise words rather than as prose alone. The image must carry the explanatory content, not decorate it — decorative imagery adds load without adding understanding (see coherence).
    copy_formulas: []
    metrics: [comprehension_proxy_task_completion, cvr, landing_engagement]
    observed_effects: []

  - id: MM-15-coherence-pruning
    mechanism_id: MM-15
    artifact_types: [landing_hero, paywall, pricing_page, email, onboarding]
    product_requirements: []
    generation_directive: "Remove material that is interesting but not essential to the point being made — tangential detail, decorative media, atmospheric copy. The coherence finding is counterintuitive and specific: adding engaging extras measurably reduces understanding of the core message, even when the extras are enjoyed."
    copy_formulas: []
    metrics: [cvr, task_completion_rate, comprehension_proxy_task_completion]
    observed_effects: []

  - id: MM-15-signaling
    mechanism_id: MM-15
    artifact_types: [landing_hero, dashboard_widget, pricing_page, onboarding]
    product_requirements: []
    generation_directive: "Cue what matters: visual emphasis, hierarchy and structural markers that direct attention to the essential element and the relationship between elements. Signalling improves outcomes without adding content — it tells the reader where capacity should go."
    copy_formulas: []
    metrics: [cvr, attention_to_primary_action, task_completion_rate]
    observed_effects: []

  - id: MM-15-contiguity-and-redundancy
    mechanism_id: MM-15
    artifact_types: [onboarding, dashboard_widget, checkout, pricing_page]
    product_requirements: []
    generation_directive: Place words next to the image or control they describe, and present them at the same time — not in separate regions or sequential screens. Conversely, do not present identical content simultaneously in two forms (identical caption duplicating narration, text repeating verbatim what the image already states); duplication competes for the same capacity rather than reinforcing.
    copy_formulas: []
    metrics: [error_rate, time_to_complete, task_completion_rate]
    observed_effects: []

  - id: PF-16-legibility-and-plain-language
    mechanism_id: PF-16
    artifact_types: [landing_hero, paywall, pricing_page, checkout, email]
    product_requirements: []
    generation_directive: "Make genuine content easy to process: legible contrast and type, plain concrete language over jargon and abstraction, short sentences for key claims, familiar structure. Difficulty of processing is read as a property of the offer, so unnecessary complexity in stating a true claim costs credibility."
    copy_formulas: []
    metrics: [cvr, comprehension_proxy_task_completion, time_to_complete]
    observed_effects: []

  - id: PF-16-familiar-structure
    mechanism_id: PF-16
    artifact_types: [landing_hero, onboarding, checkout, dashboard_widget]
    product_requirements: []
    generation_directive: Use conventional structures where convention exists — expected placement of navigation, price, primary action, form order. Familiarity is a fluency source; novelty in structural elements imposes processing cost that is misread as difficulty with the product itself. Reserve novelty for content, not for load-bearing structure.
    copy_formulas: []
    metrics: [task_completion_rate, error_rate, cvr]
    observed_effects: []

  - id: PS-13-show-the-outcome
    mechanism_id: PS-13
    artifact_types: [landing_hero, onboarding, email]
    product_requirements: ["produces_visible_output"]
    generation_directive: Where the product produces a visible result, show the actual result rather than describing it. The image should be the concrete thing itself — a real output, a real state, a real before-and-after — not a stock illustration standing in for it, which is decorative and carries no content advantage.
    copy_formulas: []
    metrics: [cvr, landing_engagement, recall_proxy_return_rate]
    observed_effects: []

  - id: PS-13-visual-state-encoding
    mechanism_id: PS-13
    artifact_types: [dashboard_widget, onboarding]
    product_requirements: []
    generation_directive: Encode recurring, concrete states and categories visually as well as verbally — status, type, progress, ownership — so they are recognised rather than read on each encounter. This applies to concrete states; conditional or quantitative information keeps its textual form.
    copy_formulas: []
    metrics: [task_completion_rate, time_to_complete, error_rate]
    observed_effects: []

  - id: SC-17-single-dominant-element
    mechanism_id: SC-17
    artifact_types: [landing_hero, paywall, pricing_page, dashboard_widget]
    product_requirements: []
    generation_directive: Give each view one visually dominant element carrying the primary message or action, with clear subordination of the rest. Competing elements of equal weight fragment the fast initial sample and leave no message received. Hierarchy is what a two-second glance resolves.
    copy_formulas: []
    metrics: [cvr, attention_to_primary_action, bounce_rate]
    observed_effects: []

  - id: SC-17-front-loaded-meaning
    mechanism_id: SC-17
    artifact_types: [landing_hero, email, pricing_page, dashboard_widget]
    product_requirements: []
    generation_directive: Place the informative part of headings, labels and first lines at the start, and make each stand alone. Scanning samples beginnings; meaning deferred to the end of a sentence or paragraph is not collected. Structure content so that reading only the headings still conveys the substance.
    copy_formulas: []
    metrics: [landing_engagement, cvr, email_click_through]
    observed_effects: []

  - id: SC-17-avoid-ad-resemblance
    mechanism_id: SC-17
    artifact_types: [landing_hero, dashboard_widget, email]
    product_requirements: []
    generation_directive: Do not style genuine, important content in the visual idiom of advertising — banner proportions, promotional badges, isolated boxed callouts in peripheral positions. Such content is skipped unread. Conversely, never disguise promotional content as native content to evade that avoidance (see hard rules).
    copy_formulas: []
    metrics: [attention_to_primary_action, cvr]
    observed_effects: []

# ─────────────────────────────────────────────
# INTERACTIONS (separate relationship records; not ontology L2)
# ─────────────────────────────────────────────
interactions:

  - combination: [EN-03, LA-01]
    type: sequence-amplifying
    fact: "Endowment creates the value that LA-01 protects. Sequence: EN-03 → LA-01"
    grade: A-

  - combination: [LA-01, SC-06]
    type: reinforcing
    fact: Scarcity = loss of opportunity
    grade: B

  - combination: [FR-11, LA-01]
    type: reinforcing
    fact: Loss framing is the intersection of FR-11 (framing) and LA-01 (loss aversion) — presenting value as loss-avoided
    grade: B+

  - combination: [FR-11, SC-06]
    type: noted
    fact: Scarcity framing ('only 2 left') co-occurs with pricing presentation but is a distinct driver
    grade: B

# ─────────────────────────────────────────────
# CONTEXT WEIGHTS (separate contextual dimension; not ontology L3)
# ─────────────────────────────────────────────
context_weights:
  - context: user.accumulated_value_score > 0
    strong: [LA-01]
  - context: not (user.accumulated_value_score > 0)
    inactive: [LA-01]
  - context: user.has_created_or_customized_artifact OR product.has_trial
    strong: [EN-03]
  - context: not (user.has_created_or_customized_artifact OR product.has_trial)
    inactive: [EN-03]
  - context: artifact.presents_choice_or_price
    strong: [FR-11]
  - context: not (artifact.presents_choice_or_price)
    inactive: [FR-11]
  - context: product.has_genuine_limit
    strong: [SC-06]
  - context: not (product.has_genuine_limit)
    inactive: [SC-06]

# ─────────────────────────────────────────────
# HARD BOUNDARIES (absolute — legal/policy status, not preference)
# ─────────────────────────────────────────────
hard_boundaries:
  - real-loss-only: forbidden — The loss must be real; fake discounts and fake timers are forbidden
  - no-confirm-shaming: forbidden — Buttons that shame refusal ('No, I want to pay more') are forbidden
  - no-data-hostage: forbidden — Deleting user data is never used as pressure; genuine deletion requires ≥30-day notice and export
  - panic-cap: forbidden — Loss-framed pushes ≤ 1/day, no anxiety escalation
  - precondition-gate: forbidden — When accumulated_value_score = 0, the mechanism is not applied
  - real-ownership-only: forbidden
  - no-forced-investment: forbidden — coerce meaningless effort solely to manufacture endowment; investment must carry genuine user value
  - honest-trial-scope: forbidden — If trial access is partial, do not imply full possession
  - real-anchor-only: forbidden — Anchors (reference prices, tiers, 'was' prices) must be genuine; fabricated anchors and fake original prices are forbidden and often illegal
  - truthful-framing: forbidden — Framing selects emphasis among true statements; it must never misrepresent, omit material negatives deceptively, or state falsehoods
  - no-deceptive-decoy: forbidden — Decoy/reference options must be real offerings, not fake options designed solely to mislead
  - genuine-scarcity-only: forbidden — Scarcity claims (counts, deadlines, capacity) must be literally true at the moment shown; fabricated scarcity is forbidden
  - no-fake-timers: forbidden — No countdown timers that reset on reload, no fake 'X people viewing', no invented low-stock counts
  - no-manufactured-limits: forbidden — artificially restrict availability solely to manufacture urgency where no real constraint exists
  - boundary_test: If the user learned exactly how this works, would they shrug — or feel deceived?
  - boundary_test: Does the 'yours' reflect real ownership the user would recognize — or is it manufactured to create false attachment?
  - boundary_test: Is the frame emphasizing true value with a real reference point — or manufacturing a misleading comparison?
  - boundary_test: Is the limit real and verifiable — or manufactured to pressure the user with false urgency?

