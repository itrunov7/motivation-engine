pack: aha-sharing
applies_to: [share-moments, exports]
funnel_stage: activation
version: 0.1.0
nature: knowledge base. facts with evidence strength. no instructions.
source: projection of registry records RE-10 ST-09 SP-08

# ─────────────────────────────────────────────
# LAYER 1 — MECHANISMS (atoms of evidence)
# ─────────────────────────────────────────────
mechanisms:

  - id: RE-10
    name: reciprocity
    fact: Receiving something creates a felt obligation to give back.
    grade: B+
    source: The reciprocity norm — a felt obligation to return benefits received — is a broadly documented social rule (Gouldner 1960) and underlies compliance techniques like door-in-the-face (Cialdini). Field experiments (gift-exchange) show reciprocal behavior reliably.; doi:10.2307/2092623; doi:10.1037/0022-3514.31.2.206
    boundary: gift must feel genuine not transactional; effect weakens if perceived as manipulation; obligation can feel coercive if overused
    active_when: product.can_give_genuine_value_first
    realizations: [value-first, unexpected-upgrade]
    forbidden: [genuine-gift, no-coercive-obligation, no-unwanted-gifts-as-leverage]

  - id: ST-09
    name: status & comparison
    fact: People are motivated by their standing relative to others — progress, rank, recognition among a relevant peer group.
    grade: A-
    source: People evaluate themselves relative to others and are motivated by relative standing (Festinger 1954, social comparison theory). Status-seeking and positional/conspicuous consumption are well-documented in economics and consumer behavior (Veblen effects).; doi:10.1177/001872675400700202; doi:10.2307/2946511
    boundary: upward comparison can demotivate or harm wellbeing; referent group dependent; status signals are culturally specific
    active_when: product.has_progress_or_achievement
    realizations: [progress-recognition, peer-standing]
    forbidden: [no-harmful-comparison, real-achievement, comparison-opt-out, vulnerable-wellbeing]

  - id: SP-08
    name: social proof
    fact: When unsure, people look to what others do and treat it as evidence of the right choice.
    grade: A-
    source: People use others' behavior as evidence for the correct action, especially under uncertainty (Asch conformity; Cialdini's focus theory of normative conduct). Descriptive norms reliably shift behavior; online reviews measurably affect purchasing.; doi:10.1037/h0093718; doi:10.1037/0022-3514.58.6.1015; doi:10.1509/jmkg.73.4.15
    boundary: strongest under uncertainty; referent similarity matters; boomerang effect if norm is undesirable
    active_when: product.has_real_social_signal
    realizations: [usage-signal, choice-signal]
    forbidden: [real-social-data, no-fake-activity, no-fake-reviews]

# ─────────────────────────────────────────────
# CROSS-CUTTING — PERCEPTION & COMPREHENSION (S7 · applies to every element)
# ─────────────────────────────────────────────
cross_cutting_perception:

  [] # fills automatically when S7 seeds are promoted to full records (docs/s7-drafting-brief.md); pack-map needs no change (D-066)

# ─────────────────────────────────────────────
# LAYER 2 — INTERACTIONS (often stronger than any single mechanism)
# ─────────────────────────────────────────────
interactions:

  - combination: [RE-10, SP-08]
    type: noted
    fact: "Both are social-norm mechanisms but differ: reciprocity is exchange obligation, social proof is others-as-evidence"
    grade: B+

  - combination: [ST-09, SP-08]
    type: noted
    fact: Standing-relative-to-others (ST-09) differs from others-as-evidence (SP-08), though leaderboards blend both
    grade: A-

