signals:
  measured: [action_completion_rate, activation_rate, d30_retention, d7_retention, onboarding_completion, return_rate, return_rate_without_push, sessions_per_week, streak_length, task_completion_rate]
  tag: each generated element carries its mechanism id
  learning: weak/negative signal demotes a realization; strong signal spreads it — the palette evolves from outcomes

