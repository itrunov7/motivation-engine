# telemetry
# ─────────────────────────────────────────────
signals:
  measured: [achievement_completion, activation_rate, cohort_engagement, conversion_after_gift, cvr, d7_retention, engagement_depth, retention_lift, return_rate, signup_rate, tier_selection_distribution, trust_signal_engagement]
