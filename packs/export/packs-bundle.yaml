# GENERATED FILE — do not edit by hand.
# Source: packs/pack-map.yaml + registry/mechanisms/*.json + effects/*/*.json
#         + dossiers/*.json + interactions/*.json · regenerate with `npm run packs` (D-049, D-076).

pack: core-ux
applies_to: [core-product-screens]
funnel_stage: activation
version: 0.1.0
nature: knowledge base. L1/L2 facts with evidence strength; L3 preserves authored realization directives.
source: projection of registry records, first-class effects, and source-grounded realizations for VR-02 HA-04 ZE-07 CL-14 IF-18 MM-15 PF-16 PS-13 SC-17

# ─────────────────────────────────────────────
# LAYER 1 — MECHANISMS (atoms of evidence)
# ─────────────────────────────────────────────
mechanisms:

  - id: VR-02
    name: variable reward
    fact: Unpredictable rewards drive engagement far more strongly than predictable ones — the brain's dopamine system responds to the *surprise* of reward, not just the reward.
    grade: A
    source: "Variable-ratio schedules produce the highest, most persistent response rates (Skinner). Neural basis: dopamine reward-prediction-error (Schultz, Dayan & Montague 1997) — unpredictable reward drives the strongest dopamine signal.; doi:10.1126/science.275.5306.1593; doi:10.1007/s00213-006-0578-x"
    boundary: reward must be genuinely valued; unpredictability can frustrate if reward never arrives; highest abuse potential of the core set
    active_when: product.has_repeatable_reward_moment
    forbidden: [genuine-reward-only, no-gambling-mechanics, no-compulsion-loops, vulnerable-users]

  - id: HA-04
    name: habit loop
    fact: "Behavior becomes automatic when repeated in a stable context: a consistent cue triggers the action with decreasing conscious effort."
    grade: A-
    source: Habits form through context-dependent repetition until behavior becomes automatic (Lally et al. 2009, ~66-day field study; Wood & Rünger 2016 Annual Review). Cue-triggered automaticity is the well-supported core; the popular 'cue-routine-reward loop' is a useful framing of it.; doi:10.1002/ejsp.674; doi:10.1146/annurev-psych-122414-033417; doi:10.1016/j.jcps.2009.06.001
    boundary: formation is slow weeks to months; requires stable context cue; reward supports but automaticity is the core
    active_when: product.has_recurring_core_action
    forbidden: [genuine-value-habit, cue-not-harassment, no-compulsion]

  - id: ZE-07
    name: progress & incompleteness
    fact: People are pulled to close what is unfinished, and they push harder the closer the goal appears.
    grade: B+
    source: "Goal-gradient: effort accelerates near a goal (Hull 1932; field-validated by Kivetz, Urminsky & Zheng 2006). Endowed-progress effect (Nunes & Dreze 2006). Zeigarnik effect (unfinished tasks stay cognitively active) — real but with mixed replication.; doi:10.1509/jmkr.43.1.39; doi:10.1086/500480"
    boundary: zeigarnik memory effect replication mixed; requires visible attainable goal; false progress backfires if detected
    active_when: product.has_multi_step_goal
    forbidden: [true-progress-only, real-headstart-only, attainable-goal, no-manufactured-incompleteness]

# ─────────────────────────────────────────────
# CROSS-CUTTING — PERCEPTION & COMPREHENSION (S7 · applies to every element)
# ─────────────────────────────────────────────
cross_cutting_perception:

  - id: CL-14
    name: cognitive load
    fact: "Working memory is narrow: only a few elements can be held and related at once."
    grade: A
    source: Working memory processes only a few elements at once (Baddeley 1974); when presentation consumes that capacity with load unrelated to the task (extraneous load), comprehension and performance degrade. Sweller 1988 and the 1998 architecture paper established the framework; split-attention (Chandler & Sweller 1991) and the 20-years-later review (Sweller et al. 2019) sustain it across four decades.; doi:10.1207/s15516709cog1202_4; doi:10.1023/A:1022193728205
    boundary: expertise reversal what helps novices can hurt experts; load measurement relies on subjective scales; germane load construct contested; evidence base is instructional not commercial interfaces
    active_when: ""
    forbidden: [no-load-as-obstruction, no-essential-omission]

  - id: IF-18
    name: information foraging
    fact: Users do not read to find what they want; they follow cues that predict where it is.
    grade: B+
    source: "People seeking information behave like foragers: they judge, from local cues, whether a path is likely to lead to what they want ('information scent'), pursue high-scent paths, and abandon low-scent ones — behaviour governed by a cost–benefit calculus rather than exhaustive reading. Pirolli & Card (1999) formalised the theory; computational models (SNIF-ACT) predict navigation choices from scent, and applied work (the scent-of-a-site analyses, scented widgets) tests scent manipulation directly.; doi:10.1037/0033-295X.106.4.643"
    boundary: validated mainly on hypertext search and browse tasks; computational models validated on limited datasets; less established for feeds apps and mobile; scent is a perception and can be wrong
    active_when: artifact.has_navigation_or_choice_between_paths
    forbidden: [no-false-scent, no-scent-suppression-for-exit-paths]

  - id: MM-15
    name: multimedia design principles
    fact: How words and images are combined determines whether anything is understood.
    grade: A
    source: "Three decades of controlled experiments on how words and images should be combined. Established principles with the strongest support: multimedia (words plus relevant images beat words alone), coherence (removing interesting-but-extraneous material improves understanding — Mayer, Heiser & Lonn 2001), signalling (cueing the essential improves outcomes — Richter, Scheiter & Eitel meta-analysis), spatial and temporal contiguity (Ginns meta-analysis), and redundancy (duplicating identical content across channels harms rather than helps).; doi:10.1207/S15326985EP3801_6; doi:10.1017/CBO9781139547369"
    boundary: evidence base is learning outcomes not conversion; expertise reversal applies; redundancy effect has boundary conditions; richer media not automatically better
    active_when: artifact.conveys_explanatory_content
    forbidden: [no-explanatory-omission, no-misleading-visual, accessibility-preserved]

  - id: PF-16
    name: processing fluency
    fact: "When something is easy to read, see or grasp, that ease is felt as a mild positive signal and is attributed to the thing itself rather than to the processing: fluent material is liked more, trusted more and judged more true."
    grade: A-
    source: "Ease of mental processing is experienced as a positive feeling and is misattributed to the object being processed: fluently processed material is judged more likeable, more familiar, more confidently, and — critically — more true. Reber, Schwarz & Winkielman (2004) for aesthetic preference; Alter & Oppenheimer (2009) integrating the fluency literatures; Dechêne et al. (2009) meta-analysis of the truth effect.; doi:10.1207/s15327957pspr0804_3; doi:10.1177/1088868309341564"
    boundary: fluency signal meaning is learned not fixed; measurement of fluency contested; disfluency preferred in some contexts; truth effect is an ethical hazard not a tool
    active_when: ""
    forbidden: [no-fluency-for-false-claims, no-disfluency-obstruction, material-information-fluent]

  - id: PS-13
    name: picture superiority
    fact: An image of a concrete thing is remembered better than its name, and is recognised faster.
    grade: A-
    source: Pictures of concrete things are recognised and recalled better than the words naming them — the picture superiority effect, one of the most reliably reproduced findings in memory research. Paivio's dual coding account (verbal and imaginal systems encoding separately, giving pictures two routes) is the classic explanation and remains the standard applied framing.; doi:10.1093/acprof:oso/9780195066661.001.0001; doi:10.1007/BF01320076
    boundary: holds for concrete nameable items not abstract content; text superior for precise sequential technical information; dual coding explanation contested even where effect holds; memory advantage is not automatically a comprehension or conversion advantage
    active_when: content.is_concrete_depictable
    forbidden: [no-replacing-precise-information, image-must-be-content, no-misleading-depiction, accessibility-preserved]

  - id: SC-17
    name: scanning & visual attention
    fact: People do not read interfaces; they sample them.
    grade: B
    source: Interfaces are not read linearly. Initial visual judgements form within tens of milliseconds and are highly consistent (Lindgaard et al. 2006; Tractinsky et al. on immediate aesthetic perception), attention is allocated selectively by visual salience and expected relevance, and elements that look like advertising are systematically avoided regardless of their content (advertising-avoidance and banner-blindness literature).; doi:10.1080/01449290500330448; doi:10.1080/00913367.2004.10639175
    boundary: specific scan patterns are task and layout dependent; much practitioner canon is folklore from small samples; findings predate or ignore mobile and feed interfaces; banner blindness reducible by relevance and native placement
    active_when: ""
    forbidden: [no-disguised-advertising, no-hidden-material-information, no-attention-hijacking]

# ─────────────────────────────────────────────
# LAYER 2 — EFFECTS (first-class scientific phenomena)
# ─────────────────────────────────────────────
effects:

  - id: chromatic-asymmetry-in-visual-attention
    mechanism_id: CL-14
    name: Chromatic Asymmetry in Visual Attention
    fact: "There is a systematic dissociation between preattentive capture and sustained processing based on background color: yellow backgrounds optimize rapid initial attentional capture, while black backgrounds optimize sustained reading efficiency."
    grade: C+
    source: ["10.3390/sym18010076"]
    boundary: Standardized reading tasks with white text.
    realization_ids: []

  - id: cl-14-001
    mechanism_id: CL-14
    name: Split-attention effect
    fact: The split-attention effect occurs when students must split their attention between multiple sources of information, which results in a heavy cognitive load.
    grade: C+
    source: ["10.1037/0022-0663.87.2.319"]
    boundary: Instructional design and multimedia learning
    realization_ids: []

  - id: cl-14-002
    mechanism_id: CL-14
    name: Expertise reversal effect
    fact: Instructional techniques that facilitate learning among early learners may not help and may even interfere with learning among more advanced learners.
    grade: C+
    source: ["10.3109/0142159x.2014.889290"]
    boundary: Instructional design for varying levels of learner expertise
    realization_ids: [expertise-based-guidance-toggle]

  - id: cl-14-01
    mechanism_id: CL-14
    name: Imagination Effect
    fact: Imagining a procedure or concept can be a more effective instructional technique than conventional studying, provided the presentation format is integrated rather than split-attention.
    grade: C+
    source: ["10.1002/acp.1061"]
    boundary: Applies to learning procedures or concepts; effectiveness depends on the mode of presentation (integrated vs. split-attention).
    realization_ids: []

  - id: cl14-cueing
    mechanism_id: CL-14
    name: Cueing effect
    fact: Adding visual cues that relate elements of a picture to the text raised retention scores in a learner-paced classroom study, but the same study reports only a weak cueing effect that does not easily generalise to non-laboratory settings.
    grade: C
    source: ["10.1348/000709904322848824"]
    boundary: Learner-paced, non-laboratory multimedia instruction
    realization_ids: []

  - id: tracing-and-pointing
    mechanism_id: CL-14
    name: Tracing and pointing
    fact: Tracing and pointing actions using the index finger on lesson materials enhance learning and reduce extraneous cognitive load.
    grade: C+
    source: ["10.1007/s10648-025-10005-7"]
    boundary: Native Chinese-speaking adult participants learning about the human circulatory system from paper-based materials.
    realization_ids: []

