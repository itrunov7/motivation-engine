interactions:

  - combination: [VR-02, HA-04]
    type: noted
    fact: Variable reward is the reward component that makes habit loops (HA-04) sticky; HA-04 is the full loop, VR-02 is one part
    grade: A-

  - combination: [HA-04, ZE-07]
    type: noted
    fact: Progress and streaks support habit maintenance; distinct — ZE-07 is goal-directed progress, HA-04 is context-cued automaticity
    grade: B+

