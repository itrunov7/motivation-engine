  - combination: [LA-01, ST-09]
    type: sequence-amplifying
    fact: Status demotion is felt more strongly than equivalent status never attained — the loss of standing is asymmetric with its gain. Studies of hierarchical loyalty programmes find demoted customers reduce engagement more sharply than their pre-attainment baseline, and that anticipated demotion drives effort to retain tier. This is loss aversion operating on a social-standing asset rather than a material one, and it is a principal reason recurring participation continues after the initial motivation fades.
    grade: B
