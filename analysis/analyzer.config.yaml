version: 0.3.0

# Analyzer config — the ONE hand-authored input to sufficiency scoring (D-050).
#
# tools/analyzer.ts scores every [pack × active segment] cell across breadth,
# depth, and quality using traceable repository data; everything downstream
# (analysis/sufficiency-matrix.json) is a COMPUTED projection over this config
# + the pack map + the registry. Edited in git only, no UI write surface.
#
# IMPORTANT — nature of this file: the segment_stages and segment_affinity
# seeds below are PRODUCT JUDGMENT defaults (which funnel stages a segment
# type typically lives on, which mechanisms a segment strengthens), NOT
# scientific claims. They are owner-reviewable and owner-tunable; changing
# them changes emphasis inside a cell, never the underlying evidence.

# Weight per grade LETTER FAMILY (the +/- modifier collapses: A- → A).
# grade_sufficiency = weighted mean of these over a pack's mechanisms.
grade_weights:
  A: 1.0
  B: 0.6
  C: 0.2

# The "grade ≥ B" cutoff for context_coverage (fine-grained scale: B- is
# below B, so A+, A, A-, B+, B qualify).
min_context_grade: B

# Maturity stage (D-060): seed | growing | mature. This is the ONE knob that
# selects which per-criterion thresholds are active. It is owner-tunable and
# EXPLICIT — not a silent lowering of the bar. An 80% interaction_coverage bar
# is unreachable at t=0 with 12 seed mechanisms, so a stage-blind "mature" bar
# would paint honest early progress red. Green at seed stage means SEED-ADEQUATE,
# not final; the bar rises as the knowledge matures. The analyzer stamps the
# active stage + resolved thresholds into the matrix header so the cockpit
# states them plainly and nothing is hardcoded in components.
maturity_stage: seed

# Per-criterion status thresholds PER STAGE: score ≥ green → green, ≥ amber →
# amber, else red. Criteria without an override use that stage's default. Cell
# status = worst criterion. The analyzer enforces MONOTONICITY loudly: for every
# criterion, green and amber must be non-decreasing seed → growing → mature, so
# a stage never secretly relaxes below an earlier one. `mature` holds the final
# bar (unchanged from before this became stage-aware).
stage_thresholds:
  seed:
    default: { green: 0.5, amber: 0.3 }
    saturation_reached: { green: 0.8, amber: 0.5 }
    corpus_size_vs_field_estimate: { green: 0.2, amber: 0.1 }
    source_diversity: { green: 0.75, amber: 0.5 }
    recency_balance: { green: 0.15, amber: 0.08 }
    realization_density: { green: 0.34, amber: 0.17 }
    extraction_completeness: { green: 0.5, amber: 0.25 }
    interaction_coverage: { green: 0.4, amber: 0.2 }
    # Dissent is a hard hygiene bar at EVERY stage: one stripped dossier in a
    # 3–4 mechanism pack (share ≤ 0.75) must turn the cell red, not amber.
    # Hygiene is not maturity, so this bar does not relax at seed.
    dissent_completeness: { green: 1.0, amber: 0.8 }
  growing:
    default: { green: 0.65, amber: 0.4 }
    saturation_reached: { green: 0.9, amber: 0.65 }
    corpus_size_vs_field_estimate: { green: 0.4, amber: 0.2 }
    source_diversity: { green: 1.0, amber: 0.75 }
    recency_balance: { green: 0.2, amber: 0.1 }
    effect_coverage: { green: 0.75, amber: 0.5 }
    realization_density: { green: 0.67, amber: 0.34 }
    extraction_completeness: { green: 0.75, amber: 0.5 }
    interaction_coverage: { green: 0.6, amber: 0.35 }
    dissent_completeness: { green: 1.0, amber: 0.8 }
  mature:
    default: { green: 0.8, amber: 0.5 }
    saturation_reached: { green: 1.0, amber: 0.8 }
    corpus_size_vs_field_estimate: { green: 0.7, amber: 0.4 }
    source_diversity: { green: 1.0, amber: 0.8 }
    recency_balance: { green: 0.25, amber: 0.15 }
    effect_coverage: { green: 1.0, amber: 0.75 }
    realization_density: { green: 1.0, amber: 0.67 }
    extraction_completeness: { green: 1.0, amber: 0.75 }
    dissent_completeness: { green: 1.0, amber: 0.8 }

# Approved L2/L3 density targets. Scores cap at 1.0 once every pack member
# reaches the target; pending proposals never count.
depth_targets:
  effects_per_mechanism: 2
  realizations_per_mechanism: 3

# Optional correction for a demonstrably inflated automatic field estimate.
# Every override must remain reviewable and dated; absence means the analyzer
# uses saturation_report.field_union_estimate.
field_estimate_overrides: {}

# Segment → typical funnel stages (registry applicability vocabulary:
# cold_acquisition | onboarding | activation | conversion | retention |
# reactivation). Drives context_coverage: does the pack hold ≥1 grade≥B
# mechanism active on each of the segment's stages? Every ACTIVE segment
# in segments/segments.yaml must have an entry — the analyzer fails loudly
# on a missing one rather than guessing.
segment_stages:
  # business-model
  transactional-ecommerce: [cold_acquisition, conversion, reactivation]
  subscription: [conversion, retention]
  freemium: [activation, conversion]
  marketplace: [cold_acquisition, activation, retention]
  lead-gen-service: [cold_acquisition, conversion]
  one-time-digital: [cold_acquisition, conversion]
  # form
  web-saas: [onboarding, activation, retention]
  mobile-app: [onboarding, activation, retention]
  content-media: [activation, retention]
  local-offline-bridge: [cold_acquisition, conversion, reactivation]
  # audience
  b2b: [onboarding, activation, conversion]
  b2c-mass: [cold_acquisition, activation, retention]
  creator-prosumer: [activation, retention]
  # usage-rhythm
  daily-habit: [activation, retention]
  occasional-high-consideration: [cold_acquisition, conversion]

# Segment → mechanism boost. A boost > 1 marks a mechanism as especially
# load-bearing for the segment; the resulting per-mechanism weight is capped
# at 1 so affinity redistributes emphasis inside a cell without fabricating
# evidence. PRESENCE of an entry touching a pack's mechanisms is also the
# segment_evidence signal: cells without one carry segment_evidence:
# general_only — the flag that segment-specific harvesting is needed.
segment_affinity:
  daily-habit: { HA-04: 1.5, VR-02: 1.5 }
  occasional-high-consideration: { SP-08: 1.5, FR-11: 1.5 }
  transactional-ecommerce: { SC-06: 1.5, LA-01: 1.3 }

# Mechanism ids flagged replication-shaky by the owner (freshness criterion).
# Empty today → freshness scores 1.0 (green) everywhere. Replication concerns
# currently live as prose in dossier dissent / evidence caveats; flagging one
# here is an explicit owner judgment, never derived from prose.
replication_flags: []

# Evidence exhaustion (D-059). Some segment×mechanism gaps have thin real
# literature — no amount of harvesting closes them. When EVERY one of a pack's
# mechanisms has been harvested for this many CONSECUTIVE weeks (each a distinct
# maturation run) and kept coming back low-novelty (D-058), the analyzer marks
# the cell evidence_exhausted: true with its best-achievable scores, the gap
# planner drops it from the harvest queue and routes it to owner authoring, and
# the cockpit shows "thin literature — best available" instead of red-forever.
# Read from analysis/harvest-history.json (the per-target harvest ledger). A
# novel harvest resets the streak, so this is reversible. Raising K makes the
# loop try longer before giving up; a low K gives up sooner.
exhaustion:
  low_novelty_attempts: 3

# ---------------------------------------------------------------------------
# gap_planner — the ONE hand-authored input to the research queue (D-051).
#
# tools/gap-planner.ts (npm run gaps) turns the red/amber cells of
# analysis/sufficiency-matrix.json into a ranked, budget-bounded queue of
# targeted evidence harvests at analysis/research-queue.json (a COMPUTED
# projection, never hand-edited). Green cells are saturated and never queued.
#
# Ranking: importance = segment_weight × gap_size, where gap_size is the sum
# over a cell's failed criteria of (green_threshold − score) — severity, so a
# deep red cell in an important segment rises to the top. The queue length is
# bounded by the existing monthly budget/cap system (corpora/_ops/budget.json
# + the evidence connector's per-run limits) — this planner NEVER bypasses it.
#
# IMPORTANT — nature of this block: segment_weights are PRODUCT-PRIORITY
# judgment (which output-product segments matter most right now) and
# segment_qualifiers are generic SEGMENT VOCABULARY appended to a mechanism's
# own evidence terms. Neither is a scientific claim; both are owner-tunable
# and change only WHICH gaps are harvested first, never the evidence itself.
gap_planner:
  version: 0.2.0

  # Segment → importance weight. Omitted segments default to 1.0. A weight > 1
  # pulls that segment's gaps up the queue; < 1 pushes them down.
  segment_weights:
    b2b: 1.5
    subscription: 1.4
    web-saas: 1.3
    daily-habit: 1.3
    mobile-app: 1.2
    freemium: 1.2

  # Segment → qualifier tokens appended to each mechanism evidence term to make
  # the harvest segment-specific (e.g. "loss aversion" + "b2b enterprise").
  # Generic product vocabulary, NOT science. Every segment that appears in a
  # red/amber cell must have an entry — the planner fails loudly on a missing
  # one rather than harvesting unqualified.
  segment_qualifiers:
    transactional-ecommerce: "ecommerce checkout"
    subscription: "subscription retention"
    freemium: "freemium upgrade"
    marketplace: "marketplace two-sided"
    lead-gen-service: "lead generation"
    one-time-digital: "one-time digital purchase"
    web-saas: "saas onboarding"
    mobile-app: "mobile app"
    content-media: "content media feed"
    local-offline-bridge: "local offline"
    b2b: "b2b enterprise"
    b2c-mass: "consumer mass market"
    creator-prosumer: "creator prosumer"
    daily-habit: "habit daily app"
    occasional-high-consideration: "high consideration purchase"

  # Budget knobs. Effective N (max queued tasks) =
  #   min(max_tasks, floor(remaining_monthly_calls × monthly_budget_share
  #                        / estimated_calls_per_task)).
  # remaining_monthly_calls comes from computeBudgetSnapshot (the SAME monthly
  # cap system the /ops gate uses); estimated_calls_per_task mirrors the
  # evidence connector's max_calls_per_run so one task ≈ one run.
  budget:
    max_tasks: 12
    estimated_calls_per_task: 150
    monthly_budget_share: 0.5

  # Extraction is ranked here but budgeted from deterministic per-task quotes
  # in Actions. This ceiling bounds weekly work; extraction.json remains the
  # authority for per-run/monthly token and shared USD/call caps.
  pipeline_budget:
    max_tasks: 24
